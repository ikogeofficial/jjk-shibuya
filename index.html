<style>
:root{--ink:#07060d;--cursed:#7b5cff;--blood:#e0243a;--bone:#efe9df}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--bone);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl,#gl canvas,#fx{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#hudL{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 8px);width:min(230px,34vw);pointer-events:none;z-index:4}
#who{font-size:12px;font-weight:600;text-shadow:0 0 6px #000;margin-bottom:4px;letter-spacing:.02em}
.bar{height:11px;border:1px solid rgba(239,233,223,.4);border-radius:6px;background:rgba(7,6,13,.65);overflow:hidden;margin-bottom:4px}

#hpf{background:linear-gradient(90deg,#b31b2e,#ef4b5f)}
#cef{background:var(--cursed);transition:background .2s}
#cew{pointer-events:auto;padding:5px 0;margin:-5px 0 -1px}
#score{font-size:11px;opacity:.85;text-shadow:0 0 6px #000}
#sub{font-size:10px;opacity:.55;display:block;margin-top:2px}
#bar{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;z-index:5}
#bar button{font:500 11px system-ui,sans-serif;color:var(--bone);background:rgba(7,6,13,.72);border:1px solid rgba(239,233,223,.28);padding:8px 10px;border-radius:8px}
#bar button:active{background:var(--cursed)}
#status{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:14px;pointer-events:none;text-shadow:0 0 8px #000;text-align:center;z-index:4;max-width:70vw}
#msg{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;letter-spacing:.1em;color:#ff5a6a;text-shadow:0 0 14px #000;pointer-events:none;z-index:4}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(239,233,223,.8);pointer-events:none;display:none}
#look{position:fixed;left:34%;right:0;top:0;bottom:0;z-index:1}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(130px,32vh);height:min(130px,32vh);border-radius:50%;border:1px solid rgba(239,233,223,.35);background:rgba(7,6,13,.35);z-index:5}
#joy i{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:rgba(123,92,255,.65);border:1px solid var(--bone)}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 92px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:200px;height:170px;z-index:5;pointer-events:none}
#act button{position:absolute;border-radius:50%;font:600 12px system-ui,sans-serif;color:var(--bone);background:rgba(7,6,13,.6);border:1px solid rgba(239,233,223,.4);pointer-events:auto}
#act button:active,#act button.on{background:var(--cursed)}
#bAtk{right:0;bottom:0;width:84px;height:84px;font-size:14px!important;background:rgba(224,36,58,.35)!important;border-color:rgba(255,120,130,.7)!important}
#bAtk:active{background:var(--blood)!important}
#bJump{right:98px;bottom:4px;width:62px;height:62px}
#bRun{right:56px;bottom:98px;width:56px;height:56px}
#skills{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:7px;z-index:5}
.sk{position:relative;overflow:hidden;width:74px;height:min(58px,14.5vh);border-radius:12px;color:var(--bone);background:linear-gradient(160deg,rgba(40,30,80,.82),rgba(7,6,13,.82));border:1px solid rgba(160,140,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-family:inherit}
.sk b{font-size:10.5px;font-weight:600;line-height:1.1;text-align:center;position:relative;z-index:2;text-shadow:0 0 4px #000}
.sk small{font-size:9px;opacity:.75;position:relative;z-index:2}
.sk i{position:absolute;left:0;right:0;bottom:0;height:var(--cd,0%);background:rgba(0,0,0,.62);z-index:1}
.sk:active{border-color:#fff}
.sk.dim{opacity:.55}
.sk.lock{opacity:.35}
.sk.dom{border-color:rgba(255,70,90,.85);box-shadow:0 0 12px rgba(224,36,58,.45) inset,0 0 10px rgba(224,36,58,.3);background:linear-gradient(160deg,rgba(90,10,25,.85),rgba(7,6,13,.85))}
#ebars,#dmg{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:3}
.eb{position:absolute;width:56px;height:6px;margin:-3px 0 0 -28px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.35);border-radius:3px;overflow:hidden;display:none}
.eb i{display:block;height:100%;width:100%;background:#e0243a}
.dn{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:16px;color:#fff;text-shadow:0 0 6px #000,0 0 3px #000;animation:dn .9s ease-out forwards;white-space:nowrap}
.dn.bf{color:#ff3a52;font-size:20px;letter-spacing:.04em;text-shadow:0 0 10px #000,0 0 6px #ff1f3d}
@keyframes dn{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 40%,#1b1240,#07060d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#start h1{margin:0;font:800 clamp(30px,9vh,56px) 'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;letter-spacing:.1em;text-shadow:0 0 22px var(--cursed)}
#start p{margin:0;font-size:12px;opacity:.7;max-width:520px;line-height:1.5}
#go{margin-top:6px;font:700 16px system-ui,sans-serif;letter-spacing:.14em;color:#fff;background:linear-gradient(135deg,#7b5cff,#e0243a);border:0;border-radius:30px;padding:14px 44px}
#go:active{transform:scale(.97)}
#inst{display:none;font:500 12px system-ui,sans-serif;color:var(--bone);background:transparent;border:1px solid rgba(239,233,223,.4);border-radius:20px;padding:8px 16px}
#rot{position:fixed;inset:0;z-index:30;background:#07060d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:15px}
#rot span{font-size:44px;display:block;animation:rt 1.6s ease-in-out infinite}
@keyframes rt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
</style>

<body>
<div id="gl"></div>
<canvas id="fx"></canvas>
<div id="ebars"></div><div id="dmg"></div>
<div id="hudL"><div id="who"></div><div class="bar"><i id="hpf"></i></div><div id="cew"><div class="bar" style="margin:0"><i id="cef"></i></div></div><div id="score">Exorcised: 0</div><span id="sub">Shibuya</span></div>

<div id="act"><button id="bAtk">ATK</button><button id="bJump">Jump</button><button id="bRun">Run</button></div>
<div id="skills"></div>
<div id="status"></div><div id="msg"></div>
<div id="start"><h1>呪術廻戦</h1><p>Shibuya &middot; engine v0.3 &middot; landscape</p><p>Left stick: move &middot; drag right side: look &middot; ATK: combo (Black Flash can land) &middot; skill column: your character's techniques, the bottom one is the Domain Expansion</p><button id="go">TAP TO START</button><button id="inst">Install app</button></div>
<div id="rot"><span>&#x1F4F1;</span>Rotate your phone to landscape</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
if(typeof THREE==='undefined'){status('three.js failed to load - check your internet');return}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=s=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const angDiff=(a,b)=>((a-b+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;

/* ===== renderer / scene ===== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=false;
$('gl').appendChild(renderer.domElement);
const dom=renderer.domElement;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101428);
scene.fog=new THREE.Fog(0x101428,60,500);
const camera=new THREE.PerspectiveCamera(65,1,.05,900);scene.add(camera);
const hemi=new THREE.HemisphereLight(0xffffff,0x444455,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=false;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=1;sc.far=320;
sun.shadow.bias=-.0005;sun.shadow.normalBias=.6;
scene.add(sun);scene.add(sun.target);
const world=new THREE.Group();scene.add(world);
const ov=$('fx'),X=ov.getContext('2d');let W=1,H=1;
function resize(){const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;renderer.setSize(W,H);ov.width=W*d;ov.height=H*d;X.setTransform(d,0,0,d,0,0);camera.aspect=W/H;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ===== map data (OpenStreetMap, same source as engine 1 and 2) ===== */
const LAT0=35.6595,LON0=139.7005,BBOX=[35.6565,139.6965,35.6625,139.7045],KEY='jjk_shibuya_v1';
const toXY=(lat,lon)=>[(lon-LON0)*111320*Math.cos(LAT0*Math.PI/180),-(lat-LAT0)*110540];
const ROADW={motorway:18,trunk:16,primary:15,secondary:12,tertiary:10,residential:7,service:5,unclassified:7,living_street:6,pedestrian:6,footway:2.5,steps:3,path:2,cycleway:2.5};
const PAL=[[[112,118,138],[160,166,180]],[[140,126,116],[184,172,160]],[[90,100,128],[136,146,174]],[[156,146,134],[202,194,182]],[[104,90,120],[148,134,166]],[[124,132,126],[168,176,170]]];
let buildings=[],roads=[],bounds=[-400,-400,400,400];
function mkB(pts,h,id){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  return{pts,h,id,x0,y0,x1,y1,pal:Math.floor(rnd(id)*PAL.length),mesh:null};
}
function parseOSM(j){
  const b=[],r=[];
  for(const e of j.elements){
    if(e.type!=='way'||!e.geometry||!e.tags)continue;
    const pts=e.geometry.map(g=>toXY(g.lat,g.lon));
    if(e.tags.building){
      if(pts.length<4)continue;pts.pop();
      const lv=parseFloat(e.tags['building:levels']);
      const h=parseFloat(e.tags.height)||(lv?lv*3.3:8+rnd(e.id)*34);
      const bb=mkB(pts,clamp(h,4,120),e.id);
      if(bb.x1-bb.x0>3&&bb.y1-bb.y0>3)b.push(bb);
    }else if(e.tags.highway){r.push({pts,w:ROADW[e.tags.highway]||5})}
  }
  return[b,r];
}
function genCity(){
  const b=[],r=[];let id=1;
  for(let gx=-6;gx<=5;gx++)for(let gy=-5;gy<=4;gy++){
    if((gx===0||gx===-1)&&gy===0)continue;
    const ox=gx*74,oy=gy*64;
    for(let i=0;i<2;i++)for(let j=0;j<2;j++){
      id+=5;const x=ox+8+i*32,y=oy+8+j*27,w=24+rnd(id)*4,d=20+rnd(id+1)*4;
      b.push(mkB([[x,y],[x+w,y],[x+w,y+d],[x,y+d]],10+rnd(id+2)*55,id));
    }
  }
  for(let gx=-6;gx<=6;gx++)r.push({pts:[[gx*74,-330],[gx*74,290]],w:gx%3===0?16:11});
  for(let gy=-5;gy<=5;gy++)r.push({pts:[[-450,gy*64],[450,gy*64]],w:gy%3===0?16:11});
  return[b,r];
}

/* ===== build the 3D city ===== */
const wallMats=[],roofMats=[];let lamps=null;
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
function windowTextures(){
  const mk=(lit)=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
    g.fillStyle=lit?'#000':'#e8e8ee';g.fillRect(0,0,256,256);
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){
      const x=i*64+10,y=j*64+14;
      if(lit){const r=rnd(i*7+j*13+3);if(r<.5){g.fillStyle=r<.08?'#9bb8ff':'#ffd08a';g.fillRect(x,y,44,36)}}
      else{g.fillStyle='#2a3358';g.fillRect(x,y,44,36)}
    }
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/16,1/13.2);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t};
  return[mk(false),mk(true)];
}
function buildMaterials(){
  const [map,em]=windowTextures();
  PAL.forEach(p=>{
    wallMats.push(new THREE.MeshLambertMaterial({color:new THREE.Color(p[0][0]/255,p[0][1]/255,p[0][2]/255),map,emissive:0xffffff,emissiveMap:em,emissiveIntensity:0,side:THREE.DoubleSide}));
    roofMats.push(new THREE.MeshLambertMaterial({color:new THREE.Color(p[1][0]/255,p[1][1]/255,p[1][2]/255),side:THREE.DoubleSide}));
  });
}
function buildCity(){
  buildMaterials();
  const bg=new THREE.Group();
  for(const b of buildings){
    try{
      const sh=new THREE.Shape();
      b.pts.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));
      const geo=new THREE.ExtrudeGeometry(sh,{depth:b.h,bevelEnabled:false});
      geo.rotateX(-Math.PI/2);
      const m=new THREE.Mesh(geo,[roofMats[b.pal],wallMats[b.pal]]);
      m.castShadow=m.receiveShadow=true;b.mesh=m;bg.add(m);
    }catch(e){}
  }
  world.add(bg);
  /* ground with roads painted on a texture */
  const M=40,gx0=bounds[0]-M,gz0=bounds[1]-M,gx1=bounds[2]+M,gz1=bounds[3]+M,gw=gx1-gx0,gh=gz1-gz0;
  const res=Math.min(2048,renderer.capabilities.maxTextureSize),scl=res/Math.max(gw,gh);
  const c=document.createElement('canvas');c.width=Math.ceil(gw*scl);c.height=Math.ceil(gh*scl);
  const g=c.getContext('2d');g.fillStyle='#3a3b45';g.fillRect(0,0,c.width,c.height);
  g.setTransform(scl,0,0,scl,-gx0*scl,-gz0*scl);g.lineCap='round';g.lineJoin='round';
  const path=r=>{g.beginPath();r.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]))};
  for(const r of roads){path(r);g.lineWidth=r.w+1.8;g.strokeStyle='#5a5b68';g.stroke()}
  for(const r of roads){path(r);g.lineWidth=r.w;g.strokeStyle=r.w<4?'#7a7a8a':'#2b2c35';g.stroke()}
  g.setLineDash([3,4]);g.lineCap='butt';
  for(const r of roads)if(r.w>=10){path(r);g.lineWidth=.35;g.strokeStyle='rgba(235,225,170,.5)';g.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(gw,gh).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:tex}));
  plane.position.set((gx0+gx1)/2,0,(gz0+gz1)/2);plane.receiveShadow=true;world.add(plane);
  const far=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x2c2d36}));
  far.position.y=-.06;world.add(far);
  /* street lamps (glow at night) */
  const pos=[];
  for(const r of roads){if(r.w<6)continue;let carry=0;
    for(let i=0;i<r.pts.length-1;i++){const a=r.pts[i],b=r.pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<.01)continue;
      let d=carry;while(d<L){const t=d/L;pos.push(a[0]+(b[0]-a[0])*t,5.5,a[1]+(b[1]-a[1])*t);d+=16}carry=d-L}}
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  lamps=new THREE.Points(lg,new THREE.PointsMaterial({size:5,map:glowTex(),color:0xffcd82,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  world.add(lamps);
}
async function loadMap(){
  status('Loading Shibuya streets from OpenStreetMap...');
  let src='Real streets - OpenStreetMap';
  try{
    let j=null;try{j=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(!j){
      const q='[out:json][timeout:25];(way["building"]('+BBOX+');way["highway"]('+BBOX+'););out geom;';
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
      const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      clearTimeout(to);if(!res.ok)throw 0;j=await res.json();
      try{localStorage.setItem(KEY,JSON.stringify(j))}catch(e){}
    }
    [buildings,roads]=parseOSM(j);if(buildings.length<20)throw 0;
    const a=toXY(BBOX[0],BBOX[1]),c=toXY(BBOX[2],BBOX[3]);
    bounds=[Math.min(a[0],c[0]),Math.min(a[1],c[1]),Math.max(a[0],c[0]),Math.max(a[1],c[1])];
  }catch(e){
    [buildings,roads]=genCity();bounds=[-440,-330,440,290];src='Offline demo city (needs internet for real streets)';
  }
  buildCity();spawn();ready=true;$('sub').textContent='Shibuya - '+src;status('');
}

/* ===== collision ===== */
const P={x:0,y:0,z:0,vy:0,face:0,mv:0,t:0,moving:false};
let ready=false;
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];
  if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function hit(x,z){
  if(x<bounds[0]||x>bounds[2]||z<bounds[1]||z>bounds[3])return true;
  const o=[[.7,0],[-.7,0],[0,.5],[0,-.5]];
  for(const b of buildings){
    if(x<b.x0-1||x>b.x1+1||z<b.y0-1||z>b.y1+1)continue;
    for(const d of o)if(inPoly(x+d[0],z+d[1],b.pts))return true;
  }
  return false;
}
function spawn(){
  for(let r=0;r<120;r+=3)for(let a=0;a<12;a++){
    const x=Math.cos(a*.52)*r,z=Math.sin(a*.52)*r;if(!hit(x,z)){P.x=x;P.z=z;return}}
}
function camBlocked(q){
  for(const b of buildings){
    if(q.x<b.x0||q.x>b.x1||q.z<b.y0||q.z>b.y1||q.y>b.h)continue;
    if(inPoly(q.x,q.z,b.pts))return true;
  }
  return false;
}

/* ===== characters (blocky rig; faces +Z) ===== */
const EDGE=new THREE.LineBasicMaterial({color:0x07060d});
function bx(w,h,d,c,hang){
  const g=new THREE.BoxGeometry(w,h,d);if(hang)g.translate(0,-h/2,0);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));m.castShadow=true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),EDGE));return m;
}

const CHARS=[

];function makeArm(def,side){

  const el=new THREE.Group();el.position.y=-.32;sh.add(el);
  el.add(bx(.14,.28,.14,def.cloth,true));
  const hand=bx(.12,.12,.12,def.skin,true);hand.position.y=-.28;el.add(hand);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.position.y=-.06;hand.add(glow);

function spike(head,def,x,y,z,w,h,d,rx,rz){const s=bx(w,h,d,def.hair);s.position.set(x,y,z);s.rotation.set(rx,0,rz);head.add(s)}

    const s=bx(.21,.1,.3,'#0b0b12');s.position.set(0,-.78,.03);l.add(s);body.add(l);return l};
  rig.legL=leg(.13);rig.legR=leg(-.13);
  const torso=bx(.5,.58,.28,def.cloth);torso.position.y=1.11;body.add(torso);
  if(def.hood){const h=bx(.5,.16,.16,def.trim);h.position.set(0,1.36,-.17);body.add(h)}
  if(def.kimono){const k=bx(.58,.5,.34,def.cloth);k.position.y=.62;body.add(k);const c=bx(.2,.22,.02,def.trim);c.position.set(0,1.25,.15);body.add(c)}
  if(def.style==='gojo'){const c=bx(.46,.12,.31,def.cloth);c.position.y=1.4;body.add(c)}
  if(def.style==='megumi'){for(let i=0;i<3;i++){const b=bx(.04,.04,.02,def.trim);b.position.set(0,1.0+i*.16,.15);body.add(b)}}
  const head=new THREE.Group();head.position.y=1.4;body.add(head);rig.head=head;
  const f=bx(.3,.32,.3,def.skin);f.position.y=.16;head.add(f);
  for(const ex of[-.075,.075]){const e=new THREE.Mesh(new THREE.BoxGeometry(.06,.045,.01),new THREE.MeshLambertMaterial({color:def.eye||'#0b0b14'}));e.position.set(ex,.19,.152);head.add(e);rig.eyes.push(e.material)}
  if(def.blind){const b=bx(.32,.09,.32,'#0b0b12');b.position.set(0,.19,0);head.add(b);rig.blind=b}
  if(def.marks){for(const ex of[-.075,.075]){const m=bx(.05,.012,.006,'#1a1218');m.position.set(ex,.13,.153);head.add(m)}const m2=bx(.04,.1,.006,'#1a1218');m2.position.set(0,.22,.153);head.add(m2)}
  const cap=bx(.34,.1,.34,def.hair);cap.position.y=.35;head.add(cap);
  const back=bx(.34,.22,.06,def.hair);back.position.set(0,.22,-.15);head.add(back);
  if(def.style==='yuji'){
    spike(head,def,-.12,.44,.02,.07,.14,.07,0,.25);spike(head,def,0,.47,-.03,.08,.17,.08,0,0);spike(head,def,.12,.44,.03,.07,.14,.07,0,-.25);
    spike(head,def,-.06,.42,.1,.07,.1,.07,.4,.1);spike(head,def,.07,.41,-.1,.07,.12,.07,-.4,-.1);
    const fr=bx(.34,.07,.06,def.hair);fr.position.set(0,.31,.16);head.add(fr);
  }else if(def.style==='gojo'){
    for(let i=0;i<8;i++){const a=i/8*6.283,r=.11;spike(head,def,Math.cos(a)*r,.46,Math.sin(a)*r,.07,.2+rnd(i)*.08,.07,Math.sin(a)*.25,-Math.cos(a)*.25)}
    for(const x of[-.1,0,.1]){const s=bx(.06,.14,.03,def.hair);s.position.set(x,.3,.17);head.add(s)}
  }else if(def.style==='megumi'){
    for(let i=0;i<10;i++){const a=i/10*6.283,r=.12;spike(head,def,Math.cos(a)*r,.45,Math.sin(a)*r,.07,.16+rnd(i+4)*.1,.07,Math.sin(a)*.7,-Math.cos(a)*.7)}
    const fr=bx(.34,.07,.06,def.hair);fr.position.set(0,.31,.16);head.add(fr);
  }
  rig.armR=makeArm(def,-1);rig.armL=makeArm(def,1);body.add(rig.armR.sh,rig.armL.sh);

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mk=a=>a.map(k=>[k[0],hex(k[1])]);
const AMBK=mk([[0,'#171c4a'],[5,'#262a5c'],[6.5,'#e8967c'],[8,'#fff1dd'],[12,'#ffffff'],[16.5,'#ffe0b4'],[18.2,'#f0845a'],[19.8,'#34336f'],[21,'#171c4a'],[24,'#171c4a']]);
const SKYK=mk([[0,'#05071a'],[5,'#0d1030'],[6.5,'#e8967c'],[8,'#9cc7ef'],[12,'#7fb6f0'],[16.5,'#9ec4ea'],[18.2,'#f0845a'],[19.8,'#1b1c4a'],[21,'#070a1f'],[24,'#05071a']]);
function kf(K,h){for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>v+(b[1][j]-v)*t)}}return K[0][1]}
function applyLighting(){
  const hour=hourNow();let amb=kf(AMBK,hour),sky=kf(SKYK,hour);if(G.tint){amb=mixc(amb,G.tint.amb,G.tint.k);sky=mixc(sky,G.tint.sky,G.tint.k)}
  const lum=(.3*amb[0]+.59*amb[1]+.11*amb[2])/255,n=clamp((.78-lum)/.45,0,1);
  scene.background.setRGB(sky[0]/255,sky[1]/255,sky[2]/255);scene.fog.color.copy(scene.background);
  scene.fog.far=view===0?900:view===1?520:420;
  sun.color.setRGB(amb[0]/255,amb[1]/255,amb[2]/255);sun.intensity=.15+.95*lum;
  hemi.color.setRGB(sky[0]/255,sky[1]/255,sky[2]/255);hemi.groundColor.setRGB(amb[0]/700,amb[1]/700,amb[2]/700);hemi.intensity=.3+.5*lum;
  for(const m of wallMats)m.emissiveIntensity=n*1.15;
  if(lamps)lamps.material.opacity=n;
  let off;
  if(hour>6&&hour<18){const az=(hour-6)/12*Math.PI;off=[-Math.cos(az)*80,40+Math.sin(az)*70,35]}else off=[-40,90,30];
  sun.position.set(P.x+off[0],off[1],P.z+off[2]);sun.target.position.set(P.x,0,P.z);
}

const waveVS='uniform float uTime,uAmp,uFreq;varying vec3 vN,vV,vP;'+
'void main(){vec3 p=position;'+
'float w=sin(p.x*uFreq+uTime*5.0)*sin(p.y*uFreq*1.3-uTime*4.0)*sin(p.z*uFreq*0.9+uTime*3.0);'+
'float w2=sin((p.x+p.y+p.z)*uFreq*1.7-uTime*7.0);'+
'vec3 q=p+normal*uAmp*(w+0.5*w2);vec4 mv=modelViewMatrix*vec4(q,1.0);'+
'vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vP=p;gl_Position=projectionMatrix*mv;}';
const waveFS='uniform vec3 uColor;uniform float uAlpha,uTime,uBands;varying vec3 vN,vV,vP;'+
'void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.0);'+
'float b=0.5+0.5*sin(vP.y*uBands-uTime*9.0+sin(vP.x*6.0)*1.5);'+
'float a=(f*0.95+b*0.18)*uAlpha;gl_FragColor=vec4(uColor*(0.6+f),a);}';
const discVS='varying vec2 vU;varying vec3 vW;'+
'void main(){vU=position.xz;vW=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0);}';
const discFS='uniform float uTime,uAlpha,uMode;varying vec2 vU;varying vec3 vW;'+
'void main(){float r=length(vU);float rip=0.5+0.5*sin(r*38.0-uTime*3.0);'+
'float rip2=0.5+0.5*sin((vW.x*1.3+vW.z*0.9)*2.5+uTime*1.5);'+
'vec3 c=mix(vec3(0.07,0.005,0.015),vec3(0.5,0.04,0.07),rip*0.3+rip2*0.25);'+
'float edge=smoothstep(1.0,0.94,r);float rim=smoothstep(0.9,0.97,r)*smoothstep(1.0,0.98,r);'+
'gl_FragColor=vec4(c+rim*vec3(1.0,0.12,0.12),edge*uAlpha);}';
const voidVS='varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
const voidFS='uniform float uTime,uAlpha;varying vec3 vP;'+
'float h(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}'+
'void main(){vec3 d=normalize(vP);vec3 g=d*70.0;vec3 id=floor(g);vec3 f=fract(g)-0.5;float hh=h(id);'+
'float star=step(0.92,hh)*smoothstep(0.35,0.0,length(f))*(0.6+0.4*sin(uTime*3.0+hh*40.0));'+
'float ang=atan(d.z,d.x);float lines=smoothstep(0.96,1.0,sin(ang*60.0+d.y*18.0-uTime*6.0)*0.5+0.5)*0.35;'+
'float n=0.5+0.5*sin(d.x*5.0+uTime*0.4)*sin(d.y*7.0-uTime*0.3)*sin(d.z*6.0+uTime*0.5);'+
'vec3 base=mix(vec3(0.01,0.0,0.04),vec3(0.18,0.05,0.4),n*n);float hz=pow(1.0-abs(d.y),6.0);'+
'vec3 col=base+vec3(0.55,0.7,1.0)*hz*0.35+vec3(0.8,0.9,1.0)*(star+lines);gl_FragColor=vec4(col,uAlpha);}';
const floorFS='uniform float uTime,uAlpha;varying vec2 vU;varying vec3 vW;'+
'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
'void main(){float r=length(vU);vec2 g=abs(fract(vW.xz*0.35)-0.5);'+
'float grid=smoothstep(0.47,0.5,max(g.x,g.y))*0.35;vec2 id=floor(vW.xz*4.0);'+
'float st=step(0.975,h(id))*(0.5+0.5*sin(uTime*3.0+h(id)*20.0));'+
'vec3 c=mix(vec3(0.01,0.0,0.05),vec3(0.14,0.07,0.32),smoothstep(1.0,0.0,r));'+
'c+=vec3(0.5,0.6,1.0)*grid*(1.0-r)+vec3(1.0)*st*0.8;gl_FragColor=vec4(c,uAlpha*smoothstep(1.0,0.9,r));}';

const waveGeo=new THREE.SphereGeometry(1,48,32),slashGeo=new THREE.PlaneGeometry(1,1);
function waveShell(color,amp,freq,bands){
  const m=new THREE.Mesh(waveGeo,new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uAmp:{value:amp},uFreq:{value:freq},uBands:{value:bands},uAlpha:{value:1},uColor:{value:new THREE.Color(color)}},vertexShader:waveVS,fragmentShader:waveFS,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.renderOrder=5;return m}
function wset(m,t,a){m.material.uniforms.uTime.value=t;m.material.uniforms.uAlpha.value=a}
function ringMesh(color){return new THREE.Mesh(new THREE.RingGeometry(.8,1,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial(additive({color,side:THREE.DoubleSide,opacity:0})))}
function orb(color,r){return new THREE.Mesh(new THREE.SphereGeometry(r,16,12),new THREE.MeshBasicMaterial(additive({color,opacity:.9})))}
function fxAdd(o){fxRoot.add(o);return o}
function fxRemove(o){fxRoot.remove(o);o.traverse(c=>{if(c.geometry&&c.geometry!==waveGeo&&c.geometry!==slashGeo)c.geometry.dispose();if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose())}})}
function slash(pos,len,th,color,life,yaw,roll){
  const m=new THREE.Mesh(slashGeo,new THREE.MeshBasicMaterial(additive({color,side:THREE.DoubleSide})));
  m.position.copy(pos);m.rotation.set(0,yaw,roll,'YXZ');m.scale.set(.1,th,1);m.userData={t:0,life,len,th};fxRoot.add(m);slashes.push(m)}
function burst(pos,color,n,speed,life,size){
  const g=new THREE.BufferGeometry(),p=new Float32Array(n*3),v=[];
  for(let i=0;i<n;i++){p[i*3]=pos.x;p[i*3+1]=pos.y;p[i*3+2]=pos.z;const a=Math.random()*6.283,b=Math.random()*3.14-1.57,s=speed*(.4+Math.random()*.6);v.push(Math.cos(a)*Math.cos(b)*s,Math.sin(b)*s*.8+2,Math.sin(a)*Math.cos(b)*s)}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:size||.5,map:glowT,color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  pts.frustumCulled=false;fxRoot.add(pts);bursts.push({pts,v,t:0,life})}
function updateFx(dt){
  for(let i=slashes.length-1;i>=0;i--){const m=slashes[i],u=m.userData;u.t+=dt;const k=u.t/u.life;
    if(k>=1){fxRoot.remove(m);m.material.dispose();slashes.splice(i,1);continue}
    m.scale.set(u.len*Math.min(1,k*5),u.th*(1-k*.6),1);m.material.opacity=1-k}
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt;
    if(b.t>=b.life){fxRoot.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);continue}
    const a=b.pts.geometry.attributes.position,arr=a.array;
    for(let j=0;j<b.v.length;j+=3){arr[j]+=b.v[j]*dt;arr[j+1]+=b.v[j+1]*dt;arr[j+2]+=b.v[j+2]*dt;b.v[j+1]-=9*dt}
    a.needsUpdate=true;b.pts.material.opacity=1-b.t/b.life}
  for(let i=fxs.length-1;i>=0;i--){if(fxs[i].upd(dt)===false){fxs[i].end();fxs.splice(i,1)}}
}

function nearest(range){let b=null,bd=range;for(const e of alive()){const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<bd){bd=d;b=e}}return b}
function inCone(range,half,ang){
  const f=dirOf(ang);
  return alive().filter(e=>{const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz);if(d>range)return false;if(d<1.4)return true;return(dx*f[0]+dz*f[1])/d>Math.cos(half)})
    .sort((a,b)=>Math.hypot(a.x-P.x,a.z-P.z)-Math.hypot(b.x-P.x,b.z-P.z))}
function dmgNum(e,d,bf){
  const v=new V3(e.x,e.sc*2.4,e.z).project(camera);if(v.z>1)return;
  const el=document.createElement('div');el.className='dn'+(bf?' bf':'');el.textContent=(bf?'BLACK FLASH ':'')+Math.round(d);
  el.style.left=((v.x+1)/2*W)+'px';el.style.top=((1-v.y)/2*H)+'px';$('dmg').appendChild(el);setTimeout(()=>el.remove(),900)}
function hurt(e,dmg,o){
  if(e.dead)return;o=o||{};
  e.hp-=dmg;e.fl=.14;
  if(o.kb){e.vx+=o.kb[0];e.vz+=o.kb[1]}
  if(o.stun)e.stun=Math.max(e.stun,o.stun);
  if(e.at&&dmg>=20&&!o.noInterrupt){e.at=null;e.cool=.6}
  dmgNum(e,dmg,o.bf);
  if(!o.noCE)G.ce=Math.min(100,G.ce+2);
  if(e.hp<=0)kill(e)}
function kill(e){e.dead=true;e.dis=0;G.score++;
  burst(new V3(e.x,1.5,e.z),0x7a2cff,24,7,.9,.7);burst(new V3(e.x,1.2,e.z),0x1a0828,16,5,1,1.1)}
function hurtPlayer(d){
  if(G.invuln>0||G.dead>0)return;
  G.hp-=d;G.redT=.3;G.shake=Math.max(G.shake,.5);
  if(G.hp<=0){G.hp=0;die()}}
function die(){if(sk)endSkill();atk=null;G.dead=2.8;$('msg').textContent='Exorcised... respawning'}
function blackFlashAt(pos){
  G.bf={t:0,pos:pos.clone(),seed:Math.random()*1000};G.hitstop=.09;G.shake=.9;
  const ring=ringMesh(0xff1f3d),light=new THREE.PointLight(0xff1f3d,8,30),g=fxAdd(new THREE.Group());
  g.position.copy(pos);ring.position.y=.06-pos.y;g.add(ring,light);
  let t=0;fxs.push({upd(dt){t+=dt;const k=t/.6;ring.scale.setScalar(1+k*9);ring.material.opacity=Math.max(0,1-k);light.intensity=Math.max(0,1-k*1.5)*8;return k<1},end(){fxRemove(g)}});
  burst(pos,0xff2040,30,10,.7,.5)}

/* ===== enemies: cursed spirits ===== */
function buildCurse(big){
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const col=big?'#2b1020':'#1e1236';
  const part=(w,h,d,x,y,z,c)=>{const m=bx(w,h,d,c);m.position.set(x,y,z);body.add(m);return m};
  part(.9,1.1,.6,0,1.15,0,col);part(.6,.5,.5,0,1.95,.05,col);part(.5,.1,.02,0,1.82,.31,'#e8e0d0');
  const eyeM=new THREE.MeshBasicMaterial({color:0xff2a44});
  for(const x of[-.14,.14]){const e=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,.02),eyeM);e.position.set(x,2.03,.31);body.add(e)}
  for(const x of[-.2,.2]){const h=bx(.08,.3,.08,'#e8e0d0');h.position.set(x,2.3,0);h.rotation.z=x>0?-.35:.35;body.add(h)}
  const arm=s=>{const sh=new THREE.Group();sh.position.set(s*.62,1.65,0);sh.add(bx(.2,1.25,.2,col,true));const cl=bx(.26,.18,.26,'#0b0610',true);cl.position.y=-1.25;sh.add(cl);body.add(sh);return sh};
  const leg=s=>{const l=new THREE.Group();l.position.set(s*.25,.6,0);l.add(bx(.3,.6,.3,col,true));body.add(l);return l};
  const r={root,body,armL:arm(1),armR:arm(-1),legL:leg(1),legR:leg(-1),eyeM};
  if(big){part(.5,.5,.4,0,1.3,-.5,'#3a1830');const x1=bx(.18,1.1,.18,col,true);x1.position.set(.3,1.7,-.5);body.add(x1)}
  return r}
function makeEnemy(x,z,big){
  const rig=buildCurse(big),sc=big?1.5:1.05;
  rig.root.scale.setScalar(sc);scene.add(rig.root);
  const bar=document.createElement('div');bar.className='eb';bar.innerHTML='<i></i>';$('ebars').appendChild(bar);
  enemies.push({rig,x,z,sc,big,hp:big?220:100,max:big?220:100,dmg:big?18:11,speed:big?4.6:4.2,reach:big?3.0:2.4,aggro:40,vx:0,vz:0,stun:0,at:null,cool:1,face:0,dead:false,dis:0,fl:0,flOn:false,burn:0,bt:0,bob:Math.random()*6,bar})}
function spawnEnemy(ahead){
  const big=G.score>=3&&Math.random()<.35;
  for(let i=0;i<30;i++){
    const a=ahead?P.face+(Math.random()-.5):Math.random()*6.283,r=ahead?16:22+Math.random()*16;
    const x=P.x+Math.sin(a)*r,z=P.z+Math.cos(a)*r;
    if(hit(x,z))continue;
    makeEnemy(x,z,big);return true}
  return false}
function stepEnemy(e,dx,dz){if(!hit(e.x+dx,e.z))e.x+=dx;if(!hit(e.x,e.z+dz))e.z+=dz}
function setFl(e,on){e.rig.root.traverse(c=>{if(c.isMesh&&c.material&&c.material.emissive)c.material.emissive.setHex(on?0x992222:0)})}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead){e.dis+=dt;e.rig.root.scale.setScalar(Math.max(.001,1-e.dis/1.1)*e.sc);e.rig.root.position.y+=dt*.8;continue}
    const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz)||1;
    e.face+=angDiff(Math.atan2(dx,dz),e.face)*Math.min(1,dt*8);
    if(e.stun>0)e.stun-=dt;
    else if(G.dead>0){}
    else if(e.at){
      e.at.t+=dt;
      if(!e.at.hit&&e.at.t>=.55){e.at.hit=true;if(d<e.reach+.7)hurtPlayer(e.dmg)}
      if(e.at.t>=.95){e.at=null;e.cool=1.2}
    }else if(d<e.aggro){
      if(d>e.reach){const sp=e.speed*dt,ox=e.x,oz=e.z;stepEnemy(e,dx/d*sp,dz/d*sp);
        if(Math.abs(e.x-ox)+Math.abs(e.z-oz)<sp*.3){const a=Math.atan2(dx,dz)+1.1;stepEnemy(e,Math.sin(a)*sp,Math.cos(a)*sp)}}
      else if(e.cool<=0)e.at={t:0,hit:false};
    }
    e.cool-=dt;
    if(e.burn>0){e.burn-=dt;e.bt+=dt;if(e.bt>.5){e.bt=0;hurt(e,6,{noCE:true,noInterrupt:true})}}
    if(Math.abs(e.vx)+Math.abs(e.vz)>.1){stepEnemy(e,e.vx*dt,e.vz*dt);const f=Math.exp(-dt*5);e.vx*=f;e.vz*=f}
    e.bob+=dt*4;const r=e.rig;r.root.position.set(e.x,Math.sin(e.bob)*.08,e.z);r.root.rotation.y=e.face;
    const wl=e.at?0:Math.sin(e.bob*2);r.legL.rotation.x=wl*.5;r.legR.rotation.x=-wl*.5;
    if(e.at){const a=e.at.t<.55?-2.4*(e.at.t/.55):-2.4+Math.min(1,(e.at.t-.55)/.15)*2.2;r.armR.rotation.x=a;r.armL.rotation.x=a*.6}
    else{r.armR.rotation.x=-wl*.3;r.armL.rotation.x=wl*.3}
    if(e.fl>0){e.fl-=dt;if(!e.flOn){setFl(e,1);e.flOn=true}}else if(e.flOn){setFl(e,0);e.flOn=false}
    r.eyeM.color.setHex(e.stun>0?0x66ccff:0xff2a44);
  }
  enemies=enemies.filter(e=>{if(e.dead&&e.dis>1.1){scene.remove(e.rig.root);e.bar.remove();return false}return true});
}

        o.ls0=-.5;o.ls1=-.2;o.le=-1.5;o.gR=t>=T-.05?1:0;o.col=sk.id==='flash'?'#ff2a44':'#ff6a3a';break}

      case'dismantle':o.rs0=-1.5;o.rs1=lerp(1.1,-1.0,clamp(t/.35,0,1));o.re=-.1;o.ls0=-.4;o.ls1=-.3;o.le=-1.2;o.gR=1;o.col='#ffffff';break;
      case'cleave':if(t<.25){o.rs0=-2.8;o.re=-.1}else{o.rs0=-1.0;o.re=-.1;o.lean=.2}o.ls0=-.4;o.le=-1;o.gR=1;o.col='#ffffff';break;
      case'fuga':o.rs0=-1.4;o.rs1=.1;o.re=-.1;o.ls0=-1.2;o.ls1=-.2;o.le=-.6;o.gR=1;o.gL=1;o.col='#ff8a30';break;
      case'shrine':o.rs0=-.7;o.rs1=.6;o.re=-1.7;o.ls0=-.7;o.ls1=-.6;o.le=-1.7;o.gR=1;o.gL=1;o.col='#ff2a44';break;

    return o}
  if(atk){const p=atk.t/atk.dur,ex=Math.sin(Math.min(1,p*1.7)*Math.PI*.5),R=atk.n%2===1;
    if(atk.n===3){o.rs0=.5*(1-ex)-1.6*ex;o.ls0=o.rs0;o.re=-.1;o.le=-.1;o.rs1=.2;o.ls1=-.2}
    else if(R){o.rs0=.6-2.1*ex;o.re=-.2;o.ls0=-.3;o.ls1=-.25;o.le=-1.3}
    else{o.ls0=.6-2.1*ex;o.le=-.2;o.rs0=-.3;o.rs1=.25;o.re=-1.3}

  for(let i=0;i<n;i++){X.beginPath();X.moveTo(-10,rnd(seed+i)*H);X.lineTo(W+10,rnd(seed+i*3+7)*H);X.stroke()}X.restore()}

function ovBF(){
  const b=G.bf,t=b.t,k=1-t/.7,p=proj(b.pos);if(!p[2])return;const hx=p[0],hy=p[1];

      for(let s=0;s<7;s++){a+=(rnd(b.seed+i*9+s+fr)-.5)*.9;const r=20+s*R;X.lineTo(hx+Math.cos(a)*r,hy+Math.sin(a)*r*.85)}X.stroke()}}

function ovSkill(){

  if(id==='flash'&&t<.25){const p=proj(handPos()),rr=14+16*(t/.25),g=X.createRadialGradient(p[0],p[1],0,p[0],p[1],rr*1.8);
    g.addColorStop(0,'rgba(5,0,8,1)');g.addColorStop(.55,'rgba(5,0,8,.95)');g.addColorStop(.7,'rgba(255,31,61,.95)');g.addColorStop(1,'rgba(255,31,61,0)');

function update(dt0){

  G.invuln=Math.max(0,G.invuln-dt);G.redT=Math.max(0,G.redT-dt0);G.comboT=Math.max(0,G.comboT-dt);
  if(G.bf){G.bf.t+=dt0;if(G.bf.t>.7)G.bf=null}
  if(G.dead>0){G.dead-=dt0;if(G.dead<=0){G.hp=100;G.ce=100;spawn();$('msg').textContent='';G.invuln=2}}
  let ix=(keys.d?1:0)-(keys.a?1:0)+jv.x,iz=(keys.s?1:0)-(keys.w?1:0)+jv.y;
  if(view===0){ix+=(keys.arrowright?1:0)-(keys.arrowleft?1:0);iz+=(keys.arrowdown?1:0)-(keys.arrowup?1:0)}
  else{look.yaw-=((keys.arrowright?1:0)-(keys.arrowleft?1:0))*1.8*dt0;look.pitch=clamp(look.pitch+((keys.arrowup?1:0)-(keys.arrowdown?1:0))*1.4*dt0,-1.2,view===2?1.4:.5)}
  const yaw=view===0?Math.PI:look.yaw,m=Math.hypot(ix,iz),rooted=(sk&&sk.root)||G.dead>0;
  P.moving=m>.15&&!rooted;
  if(P.moving){
    const nx=ix/Math.max(1,m),nz=iz/Math.max(1,m);
    const mvx=Math.sin(yaw)*(-nz)-Math.cos(yaw)*nx,mvz=Math.cos(yaw)*(-nz)+Math.sin(yaw)*nx;
    const run=keys.shift||runOn,slow=(sk||atk)?.55:1,sp=(run?13:7.5)*dt*Math.min(1,m)*slow,tx=P.x+mvx*sp,tz=P.z+mvz*sp;
    if(!hit(tx,P.z))P.x=tx;if(!hit(P.x,tz))P.z=tz;

    if(d.dash&&sk.t<d.dashT){
      const tg=sk.target;if(tg)sk.face=Math.atan2(tg.x-P.x,tg.z-P.z);
      const dd=tg?Math.hypot(tg.x-P.x,tg.z-P.z):99;
      if(dd>2){const f=dirOf(sk.face),sp=d.dash*dt;if(!hit(P.x+f[0]*sp,P.z+f[1]*sp)){P.x+=f[0]*sp;P.z+=f[1]*sp}}}
    const I=Math.min(1,sk.t/.5,(sk.dur-sk.t)/.7);

    if(tg){atk.face=Math.atan2(tg.x-P.x,tg.z-P.z);const dd=Math.hypot(tg.x-P.x,tg.z-P.z);
      if(atk.t<.2&&dd>2.1){const f=dirOf(atk.face),sp=14*dt;if(!hit(P.x+f[0]*sp,P.z+f[1]*sp)){P.x+=f[0]*sp;P.z+=f[1]*sp}}}
    if(atk.t>=.14&&!atk.hit){atk.hit=true;const list=inCone(3.4,.9,atk.face);
      if(list.length){const e=list[0],bf=Math.random()<CHARS[ci].bf,f=dirOf(atk.face),big=atk.n===3;
        if(bf){hurt(e,45,{bf:true,kb:[f[0]*14,f[1]*14],stun:.8});blackFlashAt(new V3(e.x,1.4,e.z))}
        else{hurt(e,big?17:9,{kb:[f[0]*(big?9:3),f[1]*(big?9:3)],stun:big?.4:0});G.shake=Math.max(G.shake,.15);burst(new V3(e.x,1.4,e.z),0xffffff,8,5,.3,.35)}}}
    if(atk.t>=atk.dur)atk=null}
  let ft=P.face;if(sk)ft=sk.face;else if(atk)ft=atk.face;else if(view===2)ft=look.yaw;else if(P.moving)ft=P.mv;

  G.ce=Math.min(100,G.ce+(sk?0:7)*dt);if(G.redT<=0&&G.dead<=0)G.hp=Math.min(100,G.hp+1.5*dt);

  updateFx(dt);
  animChar(dt0);updateCamera(dt0);
  if(G.shake>0){camera.position.x+=(Math.random()-.5)*G.shake;camera.position.y+=(Math.random()-.5)*G.shake;G.shake=Math.max(0,G.shake-dt0*2.5)}
  applyLighting();
  rig.root.position.set(P.x,P.y,P.z);rig.root.rotation.y=P.face;rig.root.visible=view!==2;fpGroup.visible=view===2;
  occlusion();hud()}

function updateCamera(dt){
  const m=VM[view],S=CHARS[ci].scale;
  camera.fov+=(m.fov-camera.fov)*Math.min(1,dt*8);camera.updateProjectionMatrix();
  const yaw=view===0?Math.PI:look.yaw,pitch=view===0?m.pitch:look.pitch;
  const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  const head=new THREE.Vector3(P.x,P.y+m.head*S,P.z);
  if(view===2){camera.position.copy(head);camera.lookAt(head.clone().add(dir));camHead.copy(head);return}
  camHead.lerp(head,Math.min(1,dt*8));
  let d=m.dist;
  for(let s=.15;s<=1.001;s+=.15){const q=camHead.clone().addScaledVector(dir,-m.dist*s);if(camBlocked(q)){d=m.dist*Math.max(.1,s-.15);break}}
  const pos=camHead.clone().addScaledVector(dir,-d);pos.y=Math.max(pos.y,.4);
  camera.position.copy(pos);camera.lookAt(camHead);
}
/* in the 2.5D view, hide buildings that stand between the camera and the player */
function occlusion(){
  for(const b of occHidden)if(b.mesh)b.mesh.visible=true;occHidden=[];
  if(view!==0)return;
  const a=camera.position,p=new THREE.Vector3(P.x,P.y+1,P.z),q=new THREE.Vector3();
  for(let s=0;s<=.92;s+=.06){q.copy(a).lerp(p,s);
    for(const b of buildings){
      if(!b.mesh||!b.mesh.visible||q.x<b.x0-1||q.x>b.x1+1||q.z<b.y0-1||q.z>b.y1+1||q.y>b.h)continue;
      if(inPoly(q.x,q.z,b.pts)){b.mesh.visible=false;occHidden.push(b)}
    }}
}

/* ===== loop ===== */
let last=performance.now(),began=false,started=false;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(started&&ready&&!began){began=true;startGame()}
  try{update(dt);drawOverlay()}catch(err){console.error(err);status('error: '+err.message)}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
window.__jjkStart=()=>{started=true};
window.__jjk={get ready(){return ready},G,enemies:()=>enemies,castSlot,beginSkill,punch,update,drawOverlay,setChar,cycleView,CHARS:()=>CHARS,SK,get sk(){return sk},P,frame};
setChar(0);refreshHud();loadMap();requestAnimationFrame(frame);
})();
</script>
