<script>
(function(){
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
if(typeof THREE==='undefined'){status('three.js failed to load - check your internet');return}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=s=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const angDiff=(a,b)=>((a-b+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;

/* ===== renderer / scene ===== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
const QS=['Low','Med','High'];let quality=2;try{const q=parseInt(localStorage.getItem('jjk_q'));if(q>=0&&q<=2)quality=q}catch(e){}
const PRq=()=>Math.min(devicePixelRatio||1,[1,1.5,2][quality]);
renderer.setPixelRatio(PRq());
renderer.shadowMap.enabled=false;
$('gl').appendChild(renderer.domElement);
const dom=renderer.domElement;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101428);
scene.fog=new THREE.Fog(0x101428,60,500);
const camera=new THREE.PerspectiveCamera(65,1,.05,900);scene.add(camera);
const hemi=new THREE.HemisphereLight(0xffffff,0x444455,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=false;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=1;sc.far=320;
sun.shadow.bias=-.0005;sun.shadow.normalBias=.6;
scene.add(sun);scene.add(sun.target);
const world=new THREE.Group();scene.add(world);
const ov=$('fx'),X=ov.getContext('2d');let W=1,H=1;
function resize(){renderer.setPixelRatio(PRq());const d=Math.min(PRq(),1.5);W=innerWidth;H=innerHeight;renderer.setSize(W,H);ov.width=W*d;ov.height=H*d;X.setTransform(d,0,0,d,0,0);camera.aspect=W/H;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ===== map data (OpenStreetMap, same source as engine 1 and 2) ===== */
const LAT0=35.6595,LON0=139.7005,BBOX=[35.6565,139.6965,35.6625,139.7045],KEY='jjk_shibuya_v1';
const toXY=(lat,lon)=>[(lon-LON0)*111320*Math.cos(LAT0*Math.PI/180),-(lat-LAT0)*110540];
const ROADW={motorway:18,trunk:16,primary:15,secondary:12,tertiary:10,residential:7,service:5,unclassified:7,living_street:6,pedestrian:6,footway:2.5,steps:3,path:2,cycleway:2.5};
const PAL=[[[112,118,138],[160,166,180]],[[140,126,116],[184,172,160]],[[90,100,128],[136,146,174]],[[156,146,134],[202,194,182]],[[104,90,120],[148,134,166]],[[124,132,126],[168,176,170]]];
let buildings=[],roads=[],bounds=[-400,-400,400,400];
function mkB(pts,h,id){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  return{pts,h,id,x0,y0,x1,y1,pal:Math.floor(rnd(id)*PAL.length),mesh:null};
}
function parseOSM(j){
  const b=[],r=[];
  for(const e of j.elements){
    if(e.type!=='way'||!e.geometry||!e.tags)continue;
    const pts=e.geometry.map(g=>toXY(g.lat,g.lon));
    if(e.tags.building){
      if(pts.length<4)continue;pts.pop();
      const lv=parseFloat(e.tags['building:levels']);
      const h=parseFloat(e.tags.height)||(lv?lv*3.3:8+rnd(e.id)*34);
      const bb=mkB(pts,clamp(h,4,120),e.id);
      if(bb.x1-bb.x0>3&&bb.y1-bb.y0>3)b.push(bb);
    }else if(e.tags.highway){r.push({pts,w:ROADW[e.tags.highway]||5})}
  }
  return[b,r];
}
function genCity(){
  const b=[],r=[];let id=1;
  for(let gx=-6;gx<=5;gx++)for(let gy=-5;gy<=4;gy++){
    if((gx===0||gx===-1)&&gy===0)continue;
    const ox=gx*74,oy=gy*64;
    for(let i=0;i<2;i++)for(let j=0;j<2;j++){
      id+=5;const x=ox+8+i*32,y=oy+8+j*27,w=24+rnd(id)*4,d=20+rnd(id+1)*4;
      b.push(mkB([[x,y],[x+w,y],[x+w,y+d],[x,y+d]],10+rnd(id+2)*55,id));
    }
  }
  for(let gx=-6;gx<=6;gx++)r.push({pts:[[gx*74,-330],[gx*74,290]],w:gx%3===0?16:11});
  for(let gy=-5;gy<=5;gy++)r.push({pts:[[-450,gy*64],[450,gy*64]],w:gy%3===0?16:11});
  return[b,r];
}

/* ===== build the 3D city ===== */
const wallMats=[],roofMats=[];let lamps=null;
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
function windowTextures(){
  const S=1024,C=S/4;
  const mk=(lit)=>{const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
    g.fillStyle=lit?'#000':'#eceef4';g.fillRect(0,0,S,S);
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){
      const x=i*C,y=j*C,wx=x+40,wy=y+52,ww=C-80,wh=C-112;
      if(lit){const r=rnd(i*7+j*13+3);if(r<.5){const gr=g.createLinearGradient(0,wy,0,wy+wh);gr.addColorStop(0,r<.08?'#bcd0ff':'#ffe3b0');gr.addColorStop(1,r<.08?'#7e9cff':'#ffb25e');g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);g.fillStyle='#000';g.fillRect(wx+ww/2-3,wy,6,wh)}}
      else{
        g.fillStyle='#c4c8d6';g.fillRect(wx-8,wy-8,ww+16,wh+16);
        const gr=g.createLinearGradient(wx,wy,wx+ww,wy+wh);gr.addColorStop(0,'#4a5a86');gr.addColorStop(.5,'#232b4a');gr.addColorStop(1,'#303b66');
        g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
        g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.moveTo(wx+8,wy+wh-8);g.lineTo(wx+ww*.45,wy+8);g.lineTo(wx+ww*.62,wy+8);g.lineTo(wx+ww*.25,wy+wh-8);g.fill();
        g.fillStyle='#c4c8d6';g.fillRect(wx+ww/2-3,wy,6,wh);
        g.fillStyle='rgba(0,0,0,.28)';g.fillRect(wx-14,wy+wh+8,ww+28,10);
      }
      g.fillStyle=lit?'#000':'rgba(0,0,0,.14)';g.fillRect(x,y+C-4,C,4);
    }
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/16,1/13.2);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t};
  return[mk(false),mk(true)];
}
function buildMaterials(){
  const [map,em]=windowTextures();
  PAL.forEach(p=>{
    wallMats.push(new THREE.MeshLambertMaterial({color:new THREE.Color(p[0][0]/255,p[0][1]/255,p[0][2]/255),map,emissive:0xffffff,emissiveMap:em,emissiveIntensity:0,side:THREE.DoubleSide}));
    roofMats.push(new THREE.MeshLambertMaterial({color:new THREE.Color(p[1][0]/255,p[1][1]/255,p[1][2]/255),side:THREE.DoubleSide}));
  });
}
function buildCity(){
  buildMaterials();
  const bg=new THREE.Group();
  for(const b of buildings){
    try{
      const sh=new THREE.Shape();
      b.pts.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));
      const geo=new THREE.ExtrudeGeometry(sh,{depth:b.h,bevelEnabled:false});
      geo.rotateX(-Math.PI/2);
      const m=new THREE.Mesh(geo,[roofMats[b.pal],wallMats[b.pal]]);
      m.castShadow=m.receiveShadow=true;b.mesh=m;bg.add(m);
    }catch(e){}
  }
  world.add(bg);
  /* ground with roads painted on a texture */
  const M=40,gx0=bounds[0]-M,gz0=bounds[1]-M,gx1=bounds[2]+M,gz1=bounds[3]+M,gw=gx1-gx0,gh=gz1-gz0;
  const res=Math.min(quality===0?2048:3072,renderer.capabilities.maxTextureSize),scl=res/Math.max(gw,gh);
  const c=document.createElement('canvas');c.width=Math.ceil(gw*scl);c.height=Math.ceil(gh*scl);
  const g=c.getContext('2d');g.fillStyle='#3a3b45';g.fillRect(0,0,c.width,c.height);
  g.setTransform(scl,0,0,scl,-gx0*scl,-gz0*scl);g.lineCap='round';g.lineJoin='round';
  const path=r=>{g.beginPath();r.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]))};
  for(const r of roads){path(r);g.lineWidth=r.w+1.8;g.strokeStyle='#5a5b68';g.stroke()}
  for(const r of roads){path(r);g.lineWidth=r.w;g.strokeStyle=r.w<4?'#7a7a8a':'#2b2c35';g.stroke()}
  g.setLineDash([3,4]);g.lineCap='butt';
  for(const r of roads)if(r.w>=10){path(r);g.lineWidth=.35;g.strokeStyle='rgba(235,225,170,.5)';g.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(gw,gh).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:tex}));
  plane.position.set((gx0+gx1)/2,0,(gz0+gz1)/2);plane.receiveShadow=true;world.add(plane);
  const far=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x2c2d36}));
  far.position.y=-.06;world.add(far);
  /* street lamps (glow at night) */
  const pos=[];
  for(const r of roads){if(r.w<6)continue;let carry=0;
    for(let i=0;i<r.pts.length-1;i++){const a=r.pts[i],b=r.pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<.01)continue;
      let d=carry;while(d<L){const t=d/L;pos.push(a[0]+(b[0]-a[0])*t,5.5,a[1]+(b[1]-a[1])*t);d+=16}carry=d-L}}
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  lamps=new THREE.Points(lg,new THREE.PointsMaterial({size:5,map:glowTex(),color:0xffcd82,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  world.add(lamps);
  try{buildMini(tex,gx0,gz0,gw,gh)}catch(e){console.error(e)}
}
async function loadMap(){
  status('Loading Shibuya streets from OpenStreetMap...');
  let src='Real streets - OpenStreetMap';
  try{
    let j=null;try{j=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(!j){
      const q='[out:json][timeout:25];(way["building"]('+BBOX+');way["highway"]('+BBOX+'););out geom;';
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
      const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      clearTimeout(to);if(!res.ok)throw 0;j=await res.json();
      try{localStorage.setItem(KEY,JSON.stringify(j))}catch(e){}
    }
    [buildings,roads]=parseOSM(j);if(buildings.length<20)throw 0;
    const a=toXY(BBOX[0],BBOX[1]),c=toXY(BBOX[2],BBOX[3]);
    bounds=[Math.min(a[0],c[0]),Math.min(a[1],c[1]),Math.max(a[0],c[0]),Math.max(a[1],c[1])];
  }catch(e){
    [buildings,roads]=genCity();bounds=[-440,-330,440,290];src='Offline demo city (needs internet for real streets)';
  }
  buildCity();spawn();try{placeShop()}catch(e){console.error(e)}try{placeHouses()}catch(e){console.error(e)}try{makeBeam()}catch(e){console.error(e)}ready=true;$('sub').textContent='Shibuya - '+src;status('');
}

/* ===== collision ===== */
const P={x:0,y:0,z:0,vy:0,face:0,mv:0,t:0,moving:false};
let ready=false,INT=null;
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];
  if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function hit(x,z){
  if(INT)return intHit(x,z);
  if(x<bounds[0]||x>bounds[2]||z<bounds[1]||z>bounds[3])return true;
  const o=[[.7,0],[-.7,0],[0,.5],[0,-.5]];
  for(const b of buildings){
    if(x<b.x0-1||x>b.x1+1||z<b.y0-1||z>b.y1+1)continue;
    for(const d of o)if(inPoly(x+d[0],z+d[1],b.pts))return true;
  }
  return false;
}
function spawn(){
  for(let r=0;r<120;r+=3)for(let a=0;a<12;a++){
    const x=Math.cos(a*.52)*r,z=Math.sin(a*.52)*r;if(!hit(x,z)){P.x=x;P.z=z;return}}
}
function camBlocked(q){
  if(INT)return false;
  for(const b of buildings){
    if(q.x<b.x0||q.x>b.x1||q.z<b.y0||q.z>b.y1||q.y>b.h)continue;
    if(inPoly(q.x,q.z,b.pts))return true;
  }
  return false;
}

function bx(w,h,d,c,hang){

  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));m.castShadow=true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),EDGE));return m;
}

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mk=a=>a.map(k=>[k[0],hex(k[1])]);
const AMBK=mk([[0,'#171c4a'],[5,'#262a5c'],[6.5,'#e8967c'],[8,'#fff1dd'],[12,'#ffffff'],[16.5,'#ffe0b4'],[18.2,'#f0845a'],[19.8,'#34336f'],[21,'#171c4a'],[24,'#171c4a']]);
const SKYK=mk([[0,'#05071a'],[5,'#0d1030'],[6.5,'#e8967c'],[8,'#9cc7ef'],[12,'#7fb6f0'],[16.5,'#9ec4ea'],[18.2,'#f0845a'],[19.8,'#1b1c4a'],[21,'#070a1f'],[24,'#05071a']]);
function kf(K,h){for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>v+(b[1][j]-v)*t)}}return K[0][1]}
function applyLighting(){
  const hour=hourNow();let amb=kf(AMBK,hour),sky=kf(SKYK,hour);if(G.tint){amb=mixc(amb,G.tint.amb,G.tint.k);sky=mixc(sky,G.tint.sky,G.tint.k)}
  const lum=(.3*amb[0]+.59*amb[1]+.11*amb[2])/255,n=clamp((.78-lum)/.45,0,1);
  scene.background.setRGB(sky[0]/255,sky[1]/255,sky[2]/255);scene.fog.color.copy(scene.background);
  scene.fog.far=view===0?900:view===1?520:420;
  sun.color.setRGB(amb[0]/255,amb[1]/255,amb[2]/255);sun.intensity=.15+.95*lum;
  hemi.color.setRGB(sky[0]/255,sky[1]/255,sky[2]/255);hemi.groundColor.setRGB(amb[0]/700,amb[1]/700,amb[2]/700);hemi.intensity=.3+.5*lum;
  for(const m of wallMats)m.emissiveIntensity=n*1.15;
  if(lamps)lamps.material.opacity=n;
  let off;
  if(hour>6&&hour<18){const az=(hour-6)/12*Math.PI;off=[-Math.cos(az)*80,40+Math.sin(az)*70,35]}else off=[-40,90,30];
  sun.position.set(P.x+off[0],off[1],P.z+off[2]);sun.target.position.set(P.x,0,P.z);
}

'float w2=sin((p.x+p.y+p.z)*uFreq*1.7-uTime*7.0);'+
'vec3 q=p+normal*uAmp*(w+0.5*w2);vec4 mv=modelViewMatrix*vec4(q,1.0);'+
'vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vP=p;gl_Position=projectionMatrix*mv;}';
const waveFS='uniform vec3 uColor;uniform float uAlpha,uTime,uBands;varying vec3 vN,vV,vP;'+
'void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.0);'+
'float b=0.5+0.5*sin(vP.y*uBands-uTime*9.0+sin(vP.x*6.0)*1.5);'+
'float a=(f*0.95+b*0.18)*uAlpha;gl_FragColor=vec4(uColor*(0.6+f),a);}';

function slash(pos,len,th,color,life,yaw,roll){

function burst(pos,color,n,speed,life,size){
  if(G.lowfx)n=Math.ceil(n*.5);{let tot=0;for(const b of bursts)tot+=b.n||0;n=Math.min(n,120-tot);if(n<1)return}
  const g=new THREE.BufferGeometry(),p=new Float32Array(n*3),v=[];
  for(let i=0;i<n;i++){p[i*3]=pos.x;p[i*3+1]=pos.y;p[i*3+2]=pos.z;const a=Math.random()*6.283,b=Math.random()*3.14-1.57,s=speed*(.4+Math.random()*.6);v.push(Math.cos(a)*Math.cos(b)*s,Math.sin(b)*s*.8+2,Math.sin(a)*Math.cos(b)*s)}

function updateFx(dt){
  for(let i=slashes.length-1;i>=0;i--){const m=slashes[i],u=m.userData;u.t+=dt;const k=u.t/u.life;
    if(k>=1){fxRoot.remove(m);m.material.dispose();slashes.splice(i,1);continue}
    m.scale.set(u.len*Math.min(1,k*5),u.th*(1-k*.6),1);m.material.opacity=1-k}
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt;
    if(b.t>=b.life){fxRoot.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);continue}
    const a=b.pts.geometry.attributes.position,arr=a.array;
    for(let j=0;j<b.v.length;j+=3){arr[j]+=b.v[j]*dt;arr[j+1]+=b.v[j+1]*dt;arr[j+2]+=b.v[j+2]*dt;b.v[j+1]-=9*dt;
      if(arr[j+1]<.06){arr[j+1]=.06;b.v[j+1]=Math.abs(b.v[j+1])*.3;b.v[j]*=.6;b.v[j+2]*=.6}}
    a.needsUpdate=true;b.pts.material.opacity=1-b.t/b.life}
  for(let i=fxs.length-1;i>=0;i--){if(fxs[i].upd(dt)===false){fxs[i].end();fxs.splice(i,1)}}
}
