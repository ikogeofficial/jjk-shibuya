<style>
:root{--ink:#07060d;--cursed:#7b5cff;--blood:#e0243a;--bone:#efe9df}

html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--bone);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#who{font-size:12px;font-weight:600;text-shadow:0 0 6px #000;margin-bottom:4px;letter-spacing:.02em}

#bar{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;z-index:5}

#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(239,233,223,.8);pointer-events:none;display:none}
#look{position:fixed;left:34%;right:0;top:0;bottom:0;z-index:1}

#bSlide{right:92px;bottom:0;width:50px;height:50px}
#bSlide svg{width:28px;height:28px}
#bJump{right:160px;bottom:0;width:52px;height:52px}
#bRun{right:222px;bottom:0;width:48px;height:48px}
#wbar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 190px);right:calc(env(safe-area-inset-right,0px) + 296px);margin:0 auto;max-width:330px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:4px}

.sk{position:absolute;overflow:hidden;width:50px;height:50px;border-radius:50%;pointer-events:auto;color:var(--bone);background:linear-gradient(160deg,rgba(40,30,80,.82),rgba(7,6,13,.82));border:1px solid rgba(160,140,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-family:inherit}

.sk.dim{opacity:.55}
.sk.lock{opacity:.35}
.sk.k0{right:27px;bottom:128px}
.sk.k1{right:86px;bottom:105px}

.sk.dom svg{width:34px;height:34px;position:relative;z-index:2}
#ebars,#dmg{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:3}
.eb{position:absolute;width:56px;height:6px;margin:-3px 0 0 -28px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.35);border-radius:3px;overflow:hidden;display:none}
.eb i{display:block;height:100%;width:100%;background:#e0243a}
.eb.bs{width:110px;height:8px;margin:-4px 0 0 -55px;border-color:#ffb347}.eb.bs i{background:#ff9a2a}
.dn{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:16px;color:#fff;text-shadow:0 0 6px #000,0 0 3px #000;animation:dn .9s ease-out forwards;white-space:nowrap}
.dn.bf{color:#ff3a52;font-size:20px;letter-spacing:.04em;text-shadow:0 0 10px #000,0 0 6px #ff1f3d}
@keyframes dn{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 40%,#1b1240,#07060d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}

#start p{margin:0;font-size:12px;opacity:.7;max-width:520px;line-height:1.5}
#go{margin-top:6px;font:700 16px system-ui,sans-serif;letter-spacing:.14em;color:#fff;background:linear-gradient(135deg,#7b5cff,#e0243a);border:0;border-radius:30px;padding:14px 44px}

#inst{display:none;font:500 12px system-ui,sans-serif;color:var(--bone);background:transparent;border:1px solid rgba(239,233,223,.4);border-radius:20px;padding:8px 16px}

@media (orientation:portrait){#rot{display:flex}}
#miniTap{position:fixed;z-index:6;border:1px solid rgba(160,140,255,.75);border-radius:6px;background:transparent;pointer-events:auto;font:600 9px system-ui;color:rgba(239,233,223,.8);padding:2px 4px;text-shadow:0 0 4px #000}
#enter,#shopbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:7;display:none;font:700 14px system-ui,sans-serif;color:#fff;padding:12px 22px;border-radius:26px;border:1px solid rgba(255,220,150,.85);background:linear-gradient(135deg,#a8641a,#e0243a)}
#leave{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 50px);z-index:7;display:none;font:600 12px system-ui,sans-serif;color:#fff;padding:9px 18px;border-radius:20px;border:1px solid rgba(239,233,223,.6);background:rgba(7,6,13,.8)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s;z-index:22}

#shopBox{width:min(580px,94vw);max-height:92vh;overflow:auto;touch-action:pan-y;background:#12101c;border:1px solid rgba(160,140,255,.55);border-radius:14px;padding:10px 14px}
#shopBox .sh{display:flex;justify-content:space-between;font-size:13px;padding-bottom:6px;border-bottom:1px solid rgba(239,233,223,.25)}
.wrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(239,233,223,.1);font-size:12px}
.wrow .nm{flex:1}.wrow b{display:block;font-size:13px}.wrow small{opacity:.7}
#shopBox button{font:600 12px system-ui,sans-serif;color:#fff;background:#4b34b8;border:0;border-radius:8px;padding:9px 12px}
#shopBox button.no{background:#4a4660;opacity:.7}
#shopX{margin-top:8px;width:100%;background:#2b2840!important}
</style>

<body>
<div id="gl"></div>
<canvas id="fx"></canvas>
<div id="ebars"></div><div id="dmg"></div>
<div id="hudL"><div id="who"></div><div class="bar"><i id="hpf"></i></div><div id="cew"><div class="bar" style="margin:0"><i id="cef"></i></div></div><div id="score">Exorcised: 0</div><span id="sub">Shibuya</span></div>
<div id="bar"><button id="bView"></button><button id="bChar"></button><button id="bTime"></button><button id="bQual"></button><button id="bDiff"></button></div>
<div id="cross"></div>

<div id="joy"><i></i></div>
<div id="wbar"><div id="wrow"><button id="bWf" class="wt"></button><button id="bWa" class="wt"></button><button id="bWb" class="wt"></button><button id="bWc"></button></div><div id="whp"><span id="wHpn">100</span><div id="whpb"><i id="wHpf"></i></div><span>HP</span></div><div id="wceb"><i id="wCef"></i></div></div>
<div id="act"><button id="bAtk">✊</button><button id="bSlide"><svg viewBox="0 0 28 28" fill="none" stroke="#efe9df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l8 7-8 7M15 7l8 7-8 7"/></svg></button><button id="bJump">Jump</button><button id="bRun">Run</button><button id="bHold" style="display:none;right:80px;bottom:204px;width:54px;height:54px;border-color:rgba(255,220,150,.8)">HOLD</button></div>

<div id="status"></div><div id="msg"></div>
<div id="miniTap">MAP</div><button id="enter"></button><button id="shopbtn">Talk to shopkeeper</button><button id="leave">Leave</button><div id="shopUI"><div id="shopBox"></div></div><div id="fade"></div>
<div id="start"><h1>呪術廻戦</h1><p>Shibuya &middot; engine v0.7 &middot; weapon bar</p><p>Left stick: move &middot; drag right side: look &middot; Fist: combo (Black Flash can land) &middot; round buttons: your techniques &middot; dome: Domain Expansion &middot; &raquo;: slide</p><button id="go">TAP TO START</button><button id="inst">Install app</button></div>
<div id="rot"><span>&#x1F4F1;</span>Rotate your phone to landscape</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
if(typeof THREE==='undefined'){status('three.js failed to load - check your internet');return}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=s=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const angDiff=(a,b)=>((a-b+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;

/* ===== renderer / scene ===== */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
const QS=['Low','Med','High'];let quality=2;try{const q=parseInt(localStorage.getItem('jjk_q'));if(q>=0&&q<=2)quality=q}catch(e){}
const PRq=()=>Math.min(devicePixelRatio||1,[1,1.5,2][quality]);
renderer.setPixelRatio(PRq());
renderer.shadowMap.enabled=false;
$('gl').appendChild(renderer.domElement);
const dom=renderer.domElement;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101428);
scene.fog=new THREE.Fog(0x101428,60,500);
const camera=new THREE.PerspectiveCamera(65,1,.05,900);scene.add(camera);
const hemi=new THREE.HemisphereLight(0xffffff,0x444455,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=false;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=1;sc.far=320;
sun.shadow.bias=-.0005;sun.shadow.normalBias=.6;
scene.add(sun);scene.add(sun.target);
const world=new THREE.Group();scene.add(world);
const ov=$('fx'),X=ov.getContext('2d');let W=1,H=1;
function resize(){renderer.setPixelRatio(PRq());const d=Math.min(PRq(),1.5);W=innerWidth;H=innerHeight;renderer.setSize(W,H);ov.width=W*d;ov.height=H*d;X.setTransform(d,0,0,d,0,0);camera.aspect=W/H;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ===== map data (OpenStreetMap, same source as engine 1 and 2) ===== */
const LAT0=35.6595,LON0=139.7005,BBOX=[35.6565,139.6965,35.6625,139.7045],KEY='jjk_shibuya_v1';
const toXY=(lat,lon)=>[(lon-LON0)*111320*Math.cos(LAT0*Math.PI/180),-(lat-LAT0)*110540];
const ROADW={motorway:18,trunk:16,primary:15,secondary:12,tertiary:10,residential:7,service:5,unclassified:7,living_street:6,pedestrian:6,footway:2.5,steps:3,path:2,cycleway:2.5};
const PAL=[[[112,118,138],[160,166,180]],[[140,126,116],[184,172,160]],[[90,100,128],[136,146,174]],[[156,146,134],[202,194,182]],[[104,90,120],[148,134,166]],[[124,132,126],[168,176,170]]];
let buildings=[],roads=[],bounds=[-400,-400,400,400];
function mkB(pts,h,id){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  return{pts,h,id,x0,y0,x1,y1,pal:Math.floor(rnd(id)*PAL.length),mesh:null};
}
function parseOSM(j){
  const b=[],r=[];
  for(const e of j.elements){
    if(e.type!=='way'||!e.geometry||!e.tags)continue;
    const pts=e.geometry.map(g=>toXY(g.lat,g.lon));
    if(e.tags.building){
      if(pts.length<4)continue;pts.pop();
      const lv=parseFloat(e.tags['building:levels']);
      const h=parseFloat(e.tags.height)||(lv?lv*3.3:8+rnd(e.id)*34);
      const bb=mkB(pts,clamp(h,4,120),e.id);
      if(bb.x1-bb.x0>3&&bb.y1-bb.y0>3)b.push(bb);
    }else if(e.tags.highway){r.push({pts,w:ROADW[e.tags.highway]||5})}
  }
  return[b,r];
}
function genCity(){
  const b=[],r=[];let id=1;
  for(let gx=-6;gx<=5;gx++)for(let gy=-5;gy<=4;gy++){
    if((gx===0||gx===-1)&&gy===0)continue;
    const ox=gx*74,oy=gy*64;
    for(let i=0;i<2;i++)for(let j=0;j<2;j++){
      id+=5;const x=ox+8+i*32,y=oy+8+j*27,w=24+rnd(id)*4,d=20+rnd(id+1)*4;
      b.push(mkB([[x,y],[x+w,y],[x+w,y+d],[x,y+d]],10+rnd(id+2)*55,id));
    }
  }
  for(let gx=-6;gx<=6;gx++)r.push({pts:[[gx*74,-330],[gx*74,290]],w:gx%3===0?16:11});
  for(let gy=-5;gy<=5;gy++)r.push({pts:[[-450,gy*64],[450,gy*64]],w:gy%3===0?16:11});
  return[b,r];
}

/* ===== build the 3D city ===== */
const wallMats=[],roofMats=[];let lamps=null;
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
function windowTextures(){
  const S=1024,C=S/4;
  const mk=(lit)=>{const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
    g.fillStyle=lit?'#000':'#eceef4';g.fillRect(0,0,S,S);
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){
      const x=i*C,y=j*C,wx=x+40,wy=y+52,ww=C-80,wh=C-112;
      if(lit){const r=rnd(i*7+j*13+3);if(r<.5){const gr=g.createLinearGradient(0,wy,0,wy+wh);gr.addColorStop(0,r<.08?'#bcd0ff':'#ffe3b0');gr.addColorStop(1,r<.08?'#7e9cff':'#ffb25e');g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);g.fillStyle='#000';g.fillRect(wx+ww/2-3,wy,6,wh)}}
      else{
        g.fillStyle='#c4c8d6';g.fillRect(wx-8,wy-8,ww+16,wh+16);
        const gr=g.createLinearGradient(wx,wy,wx+ww,wy+wh);gr.addColorStop(0,'#4a5a86');gr.addColorStop(.5,'#232b4a');gr.addColorStop(1,'#303b66');
        g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
        g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.moveTo(wx+8,wy+wh-8);g.lineTo(wx+ww*.45,wy+8);g.lineTo(wx+ww*.62,wy+8);g.lineTo(wx+ww*.25,wy+wh-8);g.fill();
        g.fillStyle='#c4c8d6';g.fillRect(wx+ww/2-3,wy,6,wh);
        g.fillStyle='rgba(0,0,0,.28)';g.fillRect(wx-14,wy+wh+8,ww+28,10);
      }
      g.fillStyle=lit?'#000':'rgba(0,0,0,.14)';g.fillRect(x,y+C-4,C,4);
    }
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/16,1/13.2);
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t};
  return[mk(false),mk(true)];
}
function buildMaterials(){
  const [map,em]=windowTextures();
  PAL.forEach(p=>{
    wallMats.push(new THREE.MeshLambertMaterial({color:new THREE.Color(p[0][0]/255,p[0][1]/255,p[0][2]/255),map,emissive:0xffffff,emissiveMap:em,emissiveIntensity:0,side:THREE.DoubleSide}));
    roofMats.push(new THREE.MeshLambertMaterial({color:new THREE.Color(p[1][0]/255,p[1][1]/255,p[1][2]/255),side:THREE.DoubleSide}));
  });
}
function buildCity(){
  buildMaterials();
  const bg=new THREE.Group();
  for(const b of buildings){
    try{
      const sh=new THREE.Shape();
      b.pts.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));
      const geo=new THREE.ExtrudeGeometry(sh,{depth:b.h,bevelEnabled:false});
      geo.rotateX(-Math.PI/2);

/* ===== shaders ===== */
const waveVS='uniform float uTime,uAmp,uFreq;varying vec3 vN,vV,vP;'+
'void main(){vec3 p=position;'+
'float w=sin(p.x*uFreq+uTime*5.0)*sin(p.y*uFreq*1.3-uTime*4.0)*sin(p.z*uFreq*0.9+uTime*3.0);'+
'float w2=sin((p.x+p.y+p.z)*uFreq*1.7-uTime*7.0);'+
'vec3 q=p+normal*uAmp*(w+0.5*w2);vec4 mv=modelViewMatrix*vec4(q,1.0);'+
'vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vP=p;gl_Position=projectionMatrix*mv;}';
const waveFS='uniform vec3 uColor;uniform float uAlpha,uTime,uBands;varying vec3 vN,vV,vP;'+
'void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.0);'+
'float b=0.5+0.5*sin(vP.y*uBands-uTime*9.0+sin(vP.x*6.0)*1.5);'+
'float a=(f*0.95+b*0.18)*uAlpha;gl_FragColor=vec4(uColor*(0.6+f),a);}';
const discVS='varying vec2 vU;varying vec3 vW;'+
'void main(){vU=position.xz;vW=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0);}';
const discFS='uniform float uTime,uAlpha,uMode;varying vec2 vU;varying vec3 vW;'+
'void main(){float r=length(vU);float rip=0.5+0.5*sin(r*38.0-uTime*3.0);'+
'float rip2=0.5+0.5*sin((vW.x*1.3+vW.z*0.9)*2.5+uTime*1.5);'+
'vec3 c=mix(vec3(0.07,0.005,0.015),vec3(0.5,0.04,0.07),rip*0.3+rip2*0.25);'+
'float edge=smoothstep(1.0,0.94,r);float rim=smoothstep(0.9,0.97,r)*smoothstep(1.0,0.98,r);'+
'gl_FragColor=vec4(c+rim*vec3(1.0,0.12,0.12),edge*uAlpha);}';
const voidVS='varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
const voidFS='uniform float uTime,uAlpha;varying vec3 vP;'+
'float h(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}'+
'void main(){vec3 d=normalize(vP);vec3 g=d*70.0;vec3 id=floor(g);vec3 f=fract(g)-0.5;float hh=h(id);'+
'float star=step(0.92,hh)*smoothstep(0.35,0.0,length(f))*(0.6+0.4*sin(uTime*3.0+hh*40.0));'+
'float ang=atan(d.z,d.x);float lines=smoothstep(0.96,1.0,sin(ang*60.0+d.y*18.0-uTime*6.0)*0.5+0.5)*0.35;'+
'float n=0.5+0.5*sin(d.x*5.0+uTime*0.4)*sin(d.y*7.0-uTime*0.3)*sin(d.z*6.0+uTime*0.5);'+
'vec3 base=mix(vec3(0.01,0.0,0.04),vec3(0.18,0.05,0.4),n*n);float hz=pow(1.0-abs(d.y),6.0);'+
'vec3 col=base+vec3(0.55,0.7,1.0)*hz*0.35+vec3(0.8,0.9,1.0)*(star+lines);gl_FragColor=vec4(col,uAlpha);}';
const floorFS='uniform float uTime,uAlpha;varying vec2 vU;varying vec3 vW;'+
'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
'void main(){float r=length(vU);vec2 g=abs(fract(vW.xz*0.35)-0.5);'+
'float grid=smoothstep(0.47,0.5,max(g.x,g.y))*0.35;vec2 id=floor(vW.xz*4.0);'+
'float st=step(0.975,h(id))*(0.5+0.5*sin(uTime*3.0+h(id)*20.0));'+
'vec3 c=mix(vec3(0.01,0.0,0.05),vec3(0.14,0.07,0.32),smoothstep(1.0,0.0,r));'+
'c+=vec3(0.5,0.6,1.0)*grid*(1.0-r)+vec3(1.0)*st*0.8;gl_FragColor=vec4(c,uAlpha*smoothstep(1.0,0.9,r));}';

const loopFS='uniform float uTime,uAlpha;varying vec3 vP;'+
'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
'void main(){vec3 d=normalize(vP);float ang=atan(d.z,d.x);vec2 uv=vec2(ang*26.0,d.y*34.0);'+
'float col=floor(uv.x);float sp=2.0+h(vec2(col,1.0))*5.0;float y=uv.y+uTime*sp;float row=floor(y);'+
'float on=step(0.55,h(vec2(col,row)));vec2 f=fract(vec2(uv.x,y))-0.5;'+
'float glyph=step(abs(f.x),0.28)*step(abs(f.y),0.38)*min(1.0,step(0.12,abs(f.x))+step(0.14,abs(f.y)))*step(0.5,h(vec2(col*1.7,row*2.3)));'+
'float tail=fract(y*0.08+h(vec2(col,3.0)));float br=on*glyph*(0.35+0.65*tail);'+
'vec3 base=mix(vec3(0.0,0.02,0.01),vec3(0.0,0.12,0.06),pow(1.0-abs(d.y),2.0));'+
'gl_FragColor=vec4(base+vec3(0.15,1.0,0.5)*br,uAlpha);}';
const loopFloorFS='uniform float uTime,uAlpha;varying vec2 vU;varying vec3 vW;'+
'void main(){float r=length(vU);vec2 g=abs(fract(vW.xz*0.5)-0.5);float grid=smoothstep(0.46,0.5,max(g.x,g.y));'+
'float pulse=0.5+0.5*sin(r*30.0-uTime*4.0);float rim=smoothstep(0.9,0.98,r);'+
'vec3 c=mix(vec3(0.0,0.03,0.015),vec3(0.0,0.2,0.1),pulse*0.4);c+=vec3(0.1,1.0,0.5)*(grid*0.55+rim*0.9);'+
'gl_FragColor=vec4(c,uAlpha*smoothstep(1.0,0.92,r));}';

const waveGeo=new THREE.SphereGeometry(1,48,32),slashGeo=new THREE.PlaneGeometry(1,1);
function waveShell(color,amp,freq,bands){
  const m=new THREE.Mesh(waveGeo,new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uAmp:{value:amp},uFreq:{value:freq},uBands:{value:bands},uAlpha:{value:1},uColor:{value:new THREE.Color(color)}},vertexShader:waveVS,fragmentShader:waveFS,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.renderOrder=5;return m}
function wset(m,t,a){m.material.uniforms.uTime.value=t;m.material.uniforms.uAlpha.value=a}
function ringMesh(color){return new THREE.Mesh(new THREE.RingGeometry(.8,1,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial(additive({color,side:THREE.DoubleSide,opacity:0})))}
function orb(color,r){return new THREE.Mesh(new THREE.SphereGeometry(r,16,12),new THREE.MeshBasicMaterial(additive({color,opacity:.9})))}
function fxAdd(o){fxRoot.add(o);return o}
function fxRemove(o){fxRoot.remove(o);o.traverse(c=>{if(c.geometry&&c.geometry!==waveGeo&&c.geometry!==slashGeo)c.geometry.dispose();if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose())}})}
function slash(pos,len,th,color,life,yaw,roll){
  const m=new THREE.Mesh(slashGeo,new THREE.MeshBasicMaterial(additive({color,side:THREE.DoubleSide})));
  m.position.copy(pos);m.rotation.set(0,yaw,roll,'YXZ');m.scale.set(.1,th,1);m.userData={t:0,life,len,th};fxRoot.add(m);slashes.push(m)}
function burst(pos,color,n,speed,life,size){
  const g=new THREE.BufferGeometry(),p=new Float32Array(n*3),v=[];
  for(let i=0;i<n;i++){p[i*3]=pos.x;p[i*3+1]=pos.y;p[i*3+2]=pos.z;const a=Math.random()*6.283,b=Math.random()*3.14-1.57,s=speed*(.4+Math.random()*.6);v.push(Math.cos(a)*Math.cos(b)*s,Math.sin(b)*s*.8+2,Math.sin(a)*Math.cos(b)*s)}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:size||.5,map:glowT,color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  pts.frustumCulled=false;fxRoot.add(pts);bursts.push({pts,v,t:0,life})}
function updateFx(dt){
  for(let i=slashes.length-1;i>=0;i--){const m=slashes[i],u=m.userData;u.t+=dt;const k=u.t/u.life;
    if(k>=1){fxRoot.remove(m);m.material.dispose();slashes.splice(i,1);continue}
    m.scale.set(u.len*Math.min(1,k*5),u.th*(1-k*.6),1);m.material.opacity=1-k}
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt;
    if(b.t>=b.life){fxRoot.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);continue}
    const a=b.pts.geometry.attributes.position,arr=a.array;
    for(let j=0;j<b.v.length;j+=3){arr[j]+=b.v[j]*dt;arr[j+1]+=b.v[j+1]*dt;arr[j+2]+=b.v[j+2]*dt;b.v[j+1]-=9*dt;
      if(arr[j+1]<.06){arr[j+1]=.06;b.v[j+1]=Math.abs(b.v[j+1])*.3;b.v[j]*=.6;b.v[j+2]*=.6}}
    a.needsUpdate=true;b.pts.material.opacity=1-b.t/b.life}
  for(let i=fxs.length-1;i>=0;i--){if(fxs[i].upd(dt)===false){fxs[i].end();fxs.splice(i,1)}}
}

const alive=()=>enemies.filter(e=>!e.dead);
function nearest(range){let b=null,bd=range;for(const e of alive()){const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<bd){bd=d;b=e}}return b}
function inCone(range,half,ang){
  const f=dirOf(ang);
  return alive().filter(e=>{const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz);if(d>range)return false;if(d<1.4)return true;return(dx*f[0]+dz*f[1])/d>Math.cos(half)})
    .sort((a,b)=>Math.hypot(a.x-P.x,a.z-P.z)-Math.hypot(b.x-P.x,b.z-P.z))}
function dmgNum(e,d,bf){
  const v=new V3(e.x,e.sc*2.4,e.z).project(camera);if(v.z>1)return;
  const el=document.createElement('div');el.className='dn'+(bf?' bf':'');el.textContent=(bf?'BLACK FLASH ':'')+Math.round(d);
  el.style.left=((v.x+1)/2*W)+'px';el.style.top=((1-v.y)/2*H)+'px';$('dmg').appendChild(el);setTimeout(()=>el.remove(),900)}
function hurt(e,dmg,o){
  if(e.dead||e.under)return;o=o||{};
  e.hp-=dmg;e.fl=.14;
  if(o.kb){e.vx+=o.kb[0];e.vz+=o.kb[1]}
  if(o.stun)e.stun=Math.max(e.stun,o.stun);
  if(e.at&&dmg>=20&&!o.noInterrupt){e.at=null;e.cool=.6}
  dmgNum(e,dmg,o.bf);
  if(!o.noCE)G.ce=Math.min(100,G.ce+2);
  if(e.hp<=0)kill(e)}
function kill(e){e.dead=true;e.dis=0;G.score++;SAVE.cp+=e.cp||(e.big?30:12);saveGame();endSpecial(e);
  burst(new V3(e.x,1.5,e.z),0x7a2cff,24,7,.9,.7);burst(new V3(e.x,1.2,e.z),0x1a0828,16,5,1,1.1)}
function startEnemyDomain(e,dur,dps){if(G.edom||G.dead>0)return;G.edom={src:e,t:0,dur:dur,dps:dps};status('Enemy Domain!')}
function domainWar(dt){const d=G.edom;if(!d)return;
  if(G.dead>0){G.edom=null;return}
  if(sk&&sk.id==='simple'){G.edom=null;status('Domain negated');setTimeout(()=>status(''),1200);return}
  if(sk&&sk.def.dom){const win=['gojo','core'].includes(CHARS[ci].id);G.edom=null;G.shake=.8;if(!win){endSkill()}status(win?'Domain swallowed':'Domain clash');setTimeout(()=>status(''),1200);return}
  d.t+=dt;if(d.src&&d.src.dead){G.edom=null;if(!sk)G.tint=null;return}
  if(!sk)G.tint={sky:[40,5,12],amb:[140,40,70],k:.6};
  G.hp-=d.dps*dt;G.redT=.3;if(G.hp<=0){G.hp=0;G.edom=null;die();return}
  if(d.t>=d.dur){G.edom=null;if(!sk)G.tint=null}}
const infOn=()=>CHARS[ci].id==='gojo'&&G.ce>0&&G.infB<=0&&G.dead<=0;
function hurtPlayer(d){
  if(G.invuln>0||G.dead>0)return;
  if(infOn()){G.ce=Math.max(0,G.ce-6);burst(new V3(P.x,1.3,P.z),0x9fd8ff,10,5,.3,.35);
    if(G.ce<=0){G.infB=4;warn('Infinity broken')}return}
  G.hp-=d;G.redT=.3;G.shake=Math.max(G.shake,.5);
  if(G.hp<=0){G.hp=0;die()}}
function die(){if(sk)endSkill();atk=null;G.slide=null;G.dead=2.8;$('msg').textContent='Exorcised... respawning'}
function blackFlashAt(pos){
  G.bf={t:0,pos:pos.clone(),seed:Math.random()*1000};G.hitstop=.09;G.shake=.9;

  for(const x of[-6,-2,2,6])for(const z of[-4.5,4.5])add(1,8,1,x,5.5,z,0x6e0f1b,0x1a0004);
  add(21,1.2,16,0,9.9,0,0x14070a);add(16,1.2,12,0,11.1,0,0x1a0a0d);add(10,1.4,7,0,12.4,0,0x14070a);add(14,.6,1.4,0,13.4,0,0x8a1020,0x300008);

  const bone=M(0xe8e0d0),dark=M(0x050304);

  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;

let mini=null,miniOpen=false,miniKey='';
function buildMini(tex,gx0,gz0,gw,gh){
  const ms=new THREE.Scene();ms.background=new THREE.Color(0x0b0d1a);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(gw,gh).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:tex,color:0xa8aed0}));
  ground.position.set(gx0+gw/2,0,gz0+gh/2);ms.add(ground);
  let n=0;for(const b of buildings)if(b.mesh)n+=b.mesh.geometry.attributes.position.count;
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),L=new THREE.Vector3(-.4,.8,.45).normalize();let o=0;
  for(const b of buildings){if(!b.mesh)continue;const a=b.mesh.geometry.attributes.position,arr=a.array,pal=PAL[b.pal][1];
    for(let i=0;i+2<a.count;i+=3){
      const ux=arr[i*3+3]-arr[i*3],uy=arr[i*3+4]-arr[i*3+1],uz=arr[i*3+5]-arr[i*3+2],vx=arr[i*3+6]-arr[i*3],vy=arr[i*3+7]-arr[i*3+1],vz=arr[i*3+8]-arr[i*3+2];
      let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const nl=Math.hypot(nx,ny,nz)||1;
      const sh=.45+.55*Math.abs((nx*L.x+ny*L.y+nz*L.z)/nl);
      for(let k=0;k<3;k++){const y=arr[(i+k)*3+1],m=sh*(.55+.45*Math.min(1,y/Math.max(6,b.h)));
        pos[o*3]=arr[(i+k)*3];pos[o*3+1]=y;pos[o*3+2]=arr[(i+k)*3+2];
        col[o*3]=pal[0]/255*m;col[o*3+1]=pal[1]/255*m;col[o*3+2]=pal[2]/255*m+.04;o++}}}
  const mg=new THREE.BufferGeometry();mg.setAttribute('position',new THREE.BufferAttribute(pos.slice(0,o*3),3));mg.setAttribute('color',new THREE.BufferAttribute(col.slice(0,o*3),3));
  const mm=new THREE.Mesh(mg,new THREE.MeshBasicMaterial({vertexColors:true}));mm.scale.y=.5;ms.add(mm);
  const mk=(geo,c)=>{const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:c,depthTest:false,transparent:true}));m.renderOrder=10;ms.add(m);return m};
  const pm=mk(new THREE.ConeGeometry(1.6,5,8).rotateX(Math.PI/2),0x35ffa0);
  const pool=[];for(let i=0;i<14;i++){const m=mk(new THREE.SphereGeometry(1.5,8,6),0xff3355);m.visible=false;pool.push(m)}
  mini={scene:ms,cam:new THREE.PerspectiveCamera(44,1,1,2500),pm,pool,marks:[],mk}}
function miniRect(open){
  if(open){const w=Math.min(W*.6,620),h=Math.min(H*.8,380);return{x:(W-w)/2,y:(H-h)/2,w,h}}
  return{x:14,y:92,w:132,h:clamp(H-250,56,100)}}
function renderMini(){
  const tap=$('miniTap');
  if(!mini||!ready||INT){tap.style.display='none';return}
  const r=miniRect(miniOpen),key=[r.x,r.y,r.w,r.h].join();
  tap.style.display='block';
  if(key!==miniKey){miniKey=key;tap.style.left=r.x+'px';tap.style.top=r.y+'px';tap.style.width=r.w+'px';tap.style.height=r.h+'px'}
  const yw=view===0?Math.PI:look.yaw,fx=Math.sin(yw),fz=Math.cos(yw),back=miniOpen?42:56,up=miniOpen?105:72,c=mini.cam,ah=miniOpen?12:8;
  c.aspect=r.w/r.h;c.fov=miniOpen?50:44;c.updateProjectionMatrix();
  c.position.set(P.x-fx*back,up,P.z-fz*back);c.lookAt(P.x+fx*ah,0,P.z+fz*ah);
  const sc=Math.hypot(back,up)/55;
  mini.pm.position.set(P.x,12,P.z);mini.pm.rotation.y=P.face;mini.pm.scale.setScalar(sc);
  let n=0;for(const e of enemies){if(e.dead||n>=mini.pool.length)continue;const m=mini.pool[n++];m.visible=true;m.position.set(e.x,10,e.z);m.scale.setScalar(sc*(e.big?1.6:1))}
  for(;n<mini.pool.length;n++)mini.pool[n].visible=false;
  for(const m of mini.marks){m.rotation.y+=.04;m.scale.setScalar(sc*1.3)}
  const vx=r.x,vy=H-r.y-r.h;
  renderer.setScissorTest(true);renderer.setViewport(vx,vy,r.w,r.h);renderer.setScissor(vx,vy,r.w,r.h);
  renderer.render(mini.scene,c);renderer.setScissorTest(false);renderer.setViewport(0,0,W,H)}
$('miniTap').addEventListener('pointerdown',e=>{e.preventDefault();miniOpen=!miniOpen;miniKey=''});

/* ===== update ===== */
function update(dt0){
  if(!ready)return;
  let dt=dt0;if(G.hitstop>0){G.hitstop-=dt0;dt=dt0*.1}
  for(let i=0;i<4;i++)if(cd[i]>0)cd[i]-=dt;
  G.invuln=Math.max(0,G.invuln-dt);G.redT=Math.max(0,G.redT-dt0);G.comboT=Math.max(0,G.comboT-dt);
  if(G.bf){G.bf.t+=dt0;if(G.bf.t>.7)G.bf=null}
  if(G.dead>0){G.dead-=dt0;if(G.dead<=0){G.hp=100;G.ce=100;G.burn=0;G.infB=0;G.edom=null;spawn();$('msg').textContent='';G.invuln=2}}
  let ix=(keys.d?1:0)-(keys.a?1:0)+jv.x,iz=(keys.s?1:0)-(keys.w?1:0)+jv.y;
  if(view===0){ix+=(keys.arrowright?1:0)-(keys.arrowleft?1:0);iz+=(keys.arrowdown?1:0)-(keys.arrowup?1:0)}
  else{look.yaw-=((keys.arrowright?1:0)-(keys.arrowleft?1:0))*1.8*dt0;look.pitch=clamp(look.pitch+((keys.arrowup?1:0)-(keys.arrowdown?1:0))*1.4*dt0,-1.2,view===2?1.4:.5)}
  const yaw=view===0?Math.PI:look.yaw,m=Math.hypot(ix,iz),rooted=(sk&&sk.root)||G.dead>0||!!G.slide;
  P.moving=m>.15&&!rooted;
  if(P.moving){
    const nx=ix/Math.max(1,m),nz=iz/Math.max(1,m);
    const mvx=Math.sin(yaw)*(-nz)-Math.cos(yaw)*nx,mvz=Math.cos(yaw)*(-nz)+Math.sin(yaw)*nx;
    const run=keys.shift||runOn,slow=(sk||atk)?.55:1,sp=(run?13:7.5)*dt*Math.min(1,m)*slow,tx=P.x+mvx*sp,tz=P.z+mvz*sp;
    if(!hit(tx,P.z))P.x=tx;if(!hit(P.x,tz))P.z=tz;
    P.mv=Math.atan2(mvx,mvz);P.t+=dt*(run?13:9)}
  P.vy-=24*dt;P.y+=P.vy*dt;if(P.y<0||!isFinite(P.y)){P.y=0;P.vy=0}
  G.slideCd=Math.max(0,G.slideCd-dt0);G.burn=Math.max(0,G.burn-dt);G.infB=Math.max(0,G.infB-dt);domainWar(dt);
  if(G.slide){const q=G.slide;q.t+=dt;const f=dirOf(q.a),sp=(q.t<.12?26:16)*dt,nx=P.x+f[0]*sp,nz=P.z+f[1]*sp;
    if(!hit(nx,P.z))P.x=nx;if(!hit(P.x,nz))P.z=nz;if(q.t>=q.dur)G.slide=null}
  /* skill */
  if(sk){
    sk.t+=dt;const d=sk.def;if(sk.target&&sk.target.dead)sk.target=null;
    if(d.dash&&sk.t<d.dashT){
      const tg=sk.target;if(tg)sk.face=Math.atan2(tg.x-P.x,tg.z-P.z);
      const dd=tg?Math.hypot(tg.x-P.x,tg.z-P.z):99;
      if(dd>2){const f=dirOf(sk.face),sp=d.dash*dt;if(!hit(P.x+f[0]*sp,P.z+f[1]*sp)){P.x+=f[0]*sp;P.z+=f[1]*sp}}}
    const I=Math.min(1,sk.t/.5,(sk.dur-sk.t)/.7);
    sk.fxo.upd(sk.t,dt,I);
    if(sk.t>=sk.dur)endSkill()}
  /* basic attack */
  if(atk){
    atk.t+=dt;const tg=atk.tg&&!atk.tg.dead?atk.tg:null;
    if(tg){atk.face=Math.atan2(tg.x-P.x,tg.z-P.z);const dd=Math.hypot(tg.x-P.x,tg.z-P.z);
      if(atk.t<.2&&dd>2.1){const f=dirOf(atk.face),sp=14*dt;if(!hit(P.x+f[0]*sp,P.z+f[1]*sp)){P.x+=f[0]*sp;P.z+=f[1]*sp}}}
    if(atk.t>=atk.dur*.39&&!atk.hit){atk.hit=true;const W=WPN[SAVE.eq]||WPN.fists,list=inCone(W.reach,W.half,atk.face),f=dirOf(atk.face),wm=SAVE.eq!=='fists'&&WPN[SAVE.eq],big=wm?atk.n===4:atk.n===3;
      if(wm){slash(new V3(P.x+f[0]*2.2,1.3,P.z+f[1]*2.2),W.reach*.9,big?.38:.22,W.col,big?.28:.18,atk.face,[-.5,.5,-1.2,1.4][atk.n-1]);if(big){G.shake=Math.max(G.shake,.35);G.hitstop=Math.max(G.hitstop,.04)}}
      list.slice(0,W.multi?6:1).forEach((e,i)=>{const bf=i===0&&Math.random()<CHARS[ci].bf;
        if(bf){hurt(e,45,{bf:true,kb:[f[0]*14,f[1]*14],stun:.8});blackFlashAt(new V3(e.x,1.4,e.z))}
        else{hurt(e,Math.round((big?17:9)*W.mult*(W.crit&&big?1.5:1)),{kb:[f[0]*(big?9:3),f[1]*(big?9:3)],stun:big?.4:0});G.shake=Math.max(G.shake,.15);burst(new V3(e.x,1.4,e.z),0xffffff,8,5,.3,.35)}})}
    if(atk.t>=atk.dur)atk=null}
  let ft=P.face;if(G.slide)ft=G.slide.a;else if(sk)ft=sk.face;else if(atk)ft=atk.face;else if(view===2)ft=look.yaw;else if(P.moving)ft=P.mv;
  P.face+=angDiff(ft,P.face)*Math.min(1,dt0*14);
  G.ce=Math.min(100,G.ce+(sk?0:7)*dt);if(G.redT<=0&&G.dead<=0)G.hp=Math.min(100,G.hp+(1.5+(CHARS[ci].passive==='debug'?1.6:0))*dt);
  /* world */
  if(!INT){updateEnemies(dt);
    if(G.dead<=0&&!enemies.some(e=>e.rival&&!e.dead)&&(G.rivalT-=dt)<=0){G.rivalT=45;spawnRival()}
    if(alive().length<3&&G.dead<=0){G.spawnT-=dt;if(G.spawnT<=0){spawnEnemy(false);G.spawnT=5}}}
  updateFx(dt);
  animChar(dt0);updateCamera(dt0);
  if(G.shake>0){camera.position.x+=(Math.random()-.5)*G.shake;camera.position.y+=(Math.random()-.5)*G.shake;G.shake=Math.max(0,G.shake-dt0*2.5)}
  if(!INT)applyLighting();else intTick(dt0);
  for(const w of wpns)w.visible=!sk;
  if(wpns.length&&WPN[SAVE.eq]){const w=wpns[0];w.updateWorldMatrix(true,false);
    wTip.set(0,-((WPN[SAVE.eq].len||1.2)+.15),0);w.localToWorld(wTip);
    let tg=(wTip.y<P.y+.15&&!atk)?-2.4:-.9;if(atk)tg=atk.n<=2?-.2:-.9;
    const kk=Math.min(1,dt0*(atk?22:14));for(const q of wpns)q.rotation.x+=(tg-q.rotation.x)*kk;
    trailTick(dt0)}else trailTick(dt0,true)
  rig.root.position.set(P.x,P.y,P.z);rig.root.rotation.y=P.face;rig.root.visible=view!==2;fpGroup.visible=view===2;
  occlusion();hud();placesTick()}

function updateCamera(dt){
  const m=VM[view],S=CHARS[ci].scale;
  camera.fov+=(m.fov-camera.fov)*Math.min(1,dt*8);camera.updateProjectionMatrix();
  const yaw=view===0?Math.PI:look.yaw,pitch=view===0?m.pitch:look.pitch;
  const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  const head=new THREE.Vector3(P.x,P.y+m.head*S,P.z);
  if(view===2){camera.position.copy(head);camera.lookAt(head.clone().add(dir));camHead.copy(head);return}
  camHead.lerp(head,Math.min(1,dt*8));
  let d=m.dist;
  for(let s=.15;s<=1.001;s+=.15){const q=camHead.clone().addScaledVector(dir,-m.dist*s);if(camBlocked(q)){d=m.dist*Math.max(.1,s-.15);break}}
  const pos=camHead.clone().addScaledVector(dir,-d);pos.y=Math.max(pos.y,.4);
  if(INT){const bd=INT.room.bd;pos.x=clamp(pos.x,IC.x+bd[0]-.5,IC.x+bd[2]+.5);pos.z=clamp(pos.z,IC.z+bd[1]-.5,IC.z+bd[3]+.5);pos.y=clamp(pos.y,.4,INT.room.h-.5)}
  camera.position.copy(pos);camera.lookAt(camHead);
}
/* in the 2.5D view, hide buildings that stand between the camera and the player */
function occlusion(){
  for(const b of occHidden)if(b.mesh)b.mesh.visible=true;occHidden=[];
  if(view!==0)return;
  const a=camera.position,p=new THREE.Vector3(P.x,P.y+1,P.z),q=new THREE.Vector3();
  for(let s=0;s<=.92;s+=.06){q.copy(a).lerp(p,s);
    for(const b of buildings){
      if(!b.mesh||!b.mesh.visible||q.x<b.x0-1||q.x>b.x1+1||q.z<b.y0-1||q.z>b.y1+1||q.y>b.h)continue;
      if(inPoly(q.x,q.z,b.pts)){b.mesh.visible=false;occHidden.push(b)}
    }}
}

/* ===== loop ===== */
let last=performance.now(),began=false,started=false;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(started&&ready&&!began){began=true;startGame()}
  try{update(dt);drawOverlay()}catch(err){console.error(err);status('error: '+err.message)}
  renderer.render(scene,camera);
  try{renderMini()}catch(err){if(!frame.me){frame.me=1;console.error(err)}}
  requestAnimationFrame(frame);
}
